source_id: find_by_lia_band
config_version: 3
what_it_is: NSW Liquor and Gaming Authority (Find by LIA Band) snapshot register of licensed clubs and hotels with
  gaming machine entitlements as at 1 Dec 2020.
one_row_is: one licensed venue (club or hotel) holding a liquor/gaming licence, with its trading status, location
  and gaming machine entitlement figures.
reader:
  format: csv
  encoding: utf-8
  delimiter: ','
  header_row: 1
record_id:
  hash_row: true
record_id_reason: Licence No is not unique (3305 distinct values across 3306 rows; LIQC324007158 appears twice),
  so no column set is a verified row key. Hash the row instead.
observed_at:
  from_metadata: resource_last_modified
fields:
- source: Licence Name
  canonical: entity.trading_name
  transforms:
  - name: clean_whitespace
    arg: null
  group: main
  mapping_confidence: 0.6
  reason: Name on the liquor/gaming licence for the venue (e.g. 'Royal Hotel'). The column is not labelled or described
    as the registered or licensee legal name, so under the rules it stays trading_name. Some values carry company
    suffixes (25%), but that does not make the column a registered name, so entity.legal_name and entity_type are
    not derived from it.
  proposal_agreement: resolved_by_revision
  field_confidence: 0.6
  validation:
    held_out_rows: 300
    blank: 0
    ok: 300
    skipped_not_applicable: 0
    rejected: 0
    parse_rate: 1.0
- source: Venue Address
  canonical: address.full
  transforms:
  - name: clean_whitespace
    arg: null
  group: main
  mapping_confidence: 0.85
  reason: Street address plus locality in capitals (e.g. '482 Kent St SYDNEY'). Column name and samples agree on
    venue location. No postcode or state is embedded in the value.
  proposal_agreement: agreed
  field_confidence: 0.85
  validation:
    held_out_rows: 300
    blank: 0
    ok: 300
    skipped_not_applicable: 0
    rejected: 0
    parse_rate: 1.0
- source: Venue Address
  canonical: address.locality
  transforms:
  - name: clean_whitespace
    arg: null
  - name: regex_extract
    arg: ([A-Z][A-Z ]+)$
  group: main
  mapping_confidence: 0.75
  reason: The locality is the trailing all-capitals suburb in every sample (e.g. 'SYDNEY', 'BOWRAL', 'COFFS HARBOUR').
    Street names are mixed case, so the leftmost anchored match picks the suburb. Values with no trailing capitals
    are skipped, not guessed. Confidence is below 0.9 because the pattern is verified on samples only, not on all
    3306 rows.
  proposal_agreement: resolved_by_revision
  field_confidence: 0.7
  validation:
    held_out_rows: 300
    blank: 0
    ok: 299
    skipped_not_applicable: 1
    rejected: 0
