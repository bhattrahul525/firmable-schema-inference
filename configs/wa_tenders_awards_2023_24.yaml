  reason: Only proposal 1 mapped the legal name, and its regex matches the parenthetical convention in the samples.
    The convention is inferred, so mapping_confidence stays at 0.6. Rows without parentheses are not mapped, which
    is recorded under needs_transform.
- check_id: trading_name_extraction
  action: kept
  reason: Only proposal 1 mapped the trading name, and its regex takes the text before the parenthetical. This matches
    the same inferred convention, so mapping_confidence stays at 0.5. Rows without parentheses give no trading name.
- check_id: entity_type_suffix
  action: changed
  reason: Only proposal 2 mapped entity type. The suffix rule is permitted by rule 7 because the source has no explicit
    entity-type column. It is added with mapping_confidence 0.6, and parenthetical cells resolve to unknown.
- check_id: W1-entity.legal_name-from-Supplier_Name
  action: changed
  reason: The bracket-as-legal-name rule was wrong. Brackets are not always the legal name, and many registered
    names sit outside them. The field is removed from fields and Supplier_Name is listed in needs_transform until
    a transform can identify the registered name.
- check_id: W2-entity.trading_name-from-Supplier_Name
  action: changed
  reason: The text before the brackets is not reliably a trading name, because the registered name can be outside
    the brackets and 44% of names have no brackets. The field is removed from fields and Supplier_Name is listed
    in needs_transform.
revision_history:
- round: r1
  changes:
  - what: Added entity.entity_type from Supplier_Name via entity_type_from_suffix (mapping_confidence 0.6).
    why: Proposal 2 mapped this on evidence from its own sample rows. The source has no explicit entity-type column,
      so rule 7 permits the suffix rule. Parenthetical cells return unknown, so the change does not over-claim.
  - what: Kept entity.legal_name and entity.trading_name regex extraction unchanged.
    why: Both proposals agreed on the 'Trading (Legal)' regex pattern. The pattern is consistent in the samples.
      The two proposals differed only in coverage, not in the regex itself, so no change is justified.
  - what: Kept all other fields, unmapped entries, needs_transform, observed_at, valid_from, valid_to, record_id
      and source reliability unchanged.
    why: The held-out report raises no evidence against them. The report's findings concern only the entity-type
      and name-extraction coverage.
- round: human_1
  changes:
  - what: Removed the entity.legal_name mapping from Supplier_Name (regex_extract of the parenthetical).
    why: 'Reviewer found the bracketed text is not always the registered name: the Pty Ltd name can sit outside
      the brackets, and 44% of names have no brackets. The parenthetical rule therefore assigns the wrong claim
      to legal_name. Rule 5 requires a consistent pattern before extracting, and none exists.'
  - what: Removed the entity.trading_name mapping from Supplier_Name (regex_extract of text before the parenthetical).
    why: 'Same defect: the text before the brackets is not reliably a trading name. Mapping it would publish a wrong
      trading name for many rows.'
  - what: Rewrote the needs_transform entry for Supplier_Name.
    why: The gap is no longer only the missing fallback for unbracketed names. The registered name cannot be identified
      from the text with the available transforms, so the column is needs_transform, not mapped.
  - what: Kept entity.entity_type (entity_type_from_suffix), address.full, address.postcode, record_id, observed_at,
      valid_from, valid_to, and all unmapped entries unchanged.
    why: The reviewer did not flag these. The entity_type rule depends only on the suffix test, which remains valid
      for unbracketed names; bracketed names return unknown, which is the conservative default.
validation_summary:
  held_out_rows: 300
  observations_in_held_out: 894
  abstained: []
  warnings: []
  infos: []
  critique_issues:
  - field: entity.legal_name and entity.trading_name (Supplier_Name regex_extract)
    problem: The patterns use a lazy prefix that stops at the first '(', so names containing their own parentheses
      are split wrongly. 'Jones Lang Lasalle (WA) (Jones Lang Lasalle (WA) Pty Ltd)' yields legal_name 'WA) (Jones
      Lang Lasalle (WA) Pty Ltd' (a corrupted registered name) and trading_name 'Jones Lang Lasalle' (missing '(WA)').
    suggested_fix: Anchor on the last parenthetical with a greedy prefix, e.g. legal_name '^(.+)\s*\(([^()]+)\)\s*$'
      taking group 2 and trading_name taking group 1, or exclude nested parentheses explicitly. Re-test on rows
      with parentheses inside the name, and lower mapping_confidence until the convention is verified on those rows.
  - field: entity.entity_type
    problem: 'The config reason says parenthetical ''Trading (Legal)'' cells end in '')'' and return ''unknown''.
      The observations contradict this: Integrity Executive, Dale Alcock Homes, Multicam, Hays, Talent International
      and Jones Lang Lasalle all emit ''company'', while Marty Grant and Mediquip emit ''unknown''. The stated rule
      and the actual output do not match, so the classification cannot be trusted as documented.'
    suggested_fix: Decide explicitly whether the suffix test runs on the raw cell or on the extracted legal name.
      If it is the legal name, correct the reason text and keep the mapping only where the legal name is a company
      suffix. Otherwise return 'unknown' for parenthetical rows as documented. Lower mapping_confidence accordingly.
  - field: envelope.valid_to (Final_Expiry_Date) and envelope.valid_from (Commencement_Date)
    problem: These are contract dates, but the envelope applies them to every observation in the row, including
      entity.legal_name, trading_name, entity_type and address. For example, the legal-name claim for Multicam carries
      valid_to 2023-12-06, which reads as the entity's validity end, not the contract's. Rule 10 allows valid_from/valid_to
      only for when a licence or status started or ended.
    suggested_fix: Do not use contract commencement and expiry as the validity of entity or address observations.
      Either leave valid_from/valid_to empty, or scope the dates to a contract-relationship observation type that
      the ontology supports, and record in the reason that they describe the contract term.
  proposal_disagreements:
    only_A:
    - source:
      - Supplier_Name
      canonical: entity.legal_name
      transforms:
      - clean_whitespace
      - regex_extract(^.+?\s*\((.+)\)\s*$)
    - source:
      - Supplier_Name
      canonical: entity.trading_name
      transforms:
      - clean_whitespace
      - regex_extract(^(.+?)\s*\(.+\)\s*$)
    only_B:
    - source:
      - Supplier_Name
      canonical: entity.entity_type
      transforms:
      - entity_type_from_suffix
