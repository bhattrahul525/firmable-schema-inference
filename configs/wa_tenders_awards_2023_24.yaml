  critique_issues:
  - id: c-354f4f86
    field: entity.legal_name<-Supplier_Name
    problem: Several Supplier_Name values pair a trading-style name with a parenthetical registered-style name,
      e.g. 'Programmed Property Services (Programmed Property Services Pty Ltd)', 'My Home Care (MyHomecare Pty
      Ltd)' and 'Talent International (Talent International Pty Ltd)'. The whole string is mapped to legal_name,
      so the outer name is presented as the registered name. The source does not say which part is registered.
    severity: advisory
    suggested_fix: Keep the mapping (the column is the awarded supplier's name, which rule 5 allows), but record
      a caveat that the value may combine a trading name and a registered name. If the split is needed later, add
      a transform that splits the parenthetical, or map the outer part to trading_name at 0.6 or lower after such
      a transform exists (needs_transform).
  - id: c-dbd49edd
    field: entity.legal_name<-Supplier_Name
    problem: Some values are abbreviated or carry a trustee designation rather than a plain registered name, e.g.
      'Progenesis Holdings P/L' and 'DFP Recruitment Services (DFP Recruitment Services Pty Ltd ATF The DFP Business
      Trust)'. 'ATF' means the company acts as trustee, so the trust is not the supplier itself.
    severity: advisory
    suggested_fix: Keep the mapping as published, since the source does not give a registered form. Add a note that
      'P/L' is an abbreviation and that 'ATF' indicates a trustee capacity, and do not infer entity_type from these
      strings.
  - id: c-bd51232c
    field: address.full<-Supplier_Address
    problem: The raw value 'Level 5, 25 Walters Drive, Osborne Park, OSBORNE PARK, 6017' repeats the locality, and
      clean_whitespace does not address this. The mapping keeps the duplication as published.
    severity: advisory
    suggested_fix: This is acceptable under the rule against cleaning beyond the transforms. Note the duplicated
      locality as a known quirk. Do not remove it unless a transform for that exists.
  outcome: validated_config
