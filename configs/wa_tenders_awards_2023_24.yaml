needs_transform:
- source: Supplier_Name
  why: Supplier_Name does not reliably carry the registered name. About 44% of values have no brackets (e.g. 'Peoplebank
    Australia Limited', 'Shorewater Marine'), and in bracketed values the Pty Ltd registered name may sit outside
    the brackets (e.g. 'Thermo Fisher Australia Pty Ltd (Thermo Fisher Scientific Australia Pty Ltd)'). Deciding
    which part is the registered name, and which is the trading name, needs a transform that identifies the registered
    name from the text. No such transform exists, so entity.legal_name and entity.trading_name are not mapped from
    this column.
source_reliability:
  identity: 0.7
  address: 0.6
  classification: 0.4
  contact: 0.5
source_reliability_basis: WA Government statutory tender-award disclosure, published by the Department of Treasury
  and Finance. Strong for the fact that a contract was awarded to a named supplier. Supplier names and addresses
  are as entered by buying agencies (inconsistent casing, 'Trading (Legal)' mixes), so identity and address are
  rated below a statutory company register. Classification (UNSPSC) describes goods or services rather than supplier
  industry and is weak for entity classification. Contact is not provided by the source, so 0.5 is used as an uninformed
  default.
