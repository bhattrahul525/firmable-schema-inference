  critique_issues:
  - id: c-af22cdd1
    field: address.state<-Licence Number
    problem: The constant VIC is anchored to the Licence Number column, which is an identifier and says nothing
      about state. The anchor is filled on every sample row, so it meets the rule, but the basis for 'every row
      is in Victoria' rests only on the config's reason text quoting the title, which the sample rows do not show.
    severity: advisory
    suggested_fix: Keep the constant only if the dataset title or metadata is confirmed to cover Victoria only,
      and record that basis in reason. Consider anchoring to a clearly filled jurisdictional-type column if one
      exists, or note in the reason that the anchor is arbitrary.
  - id: c-b5e38298
    field: address.full<-Street Address
    problem: Street Address is the licensed premises address (e.g. 'TENANCY FB 184, CHADSTONE SHOPPING CENTRE',
      'SHOP W03 199 WILLIAM STREET'), not the entity's registered or head-office address. The mapping states it
      as the entity's address without qualification.
    severity: advisory
    suggested_fix: Lower mapping_confidence and state in the reason that this is the licensed premises address,
      not a registered address for the licensee.
  - id: c-fc27cab3
    field: record_id
    problem: Licence Number is used as record_id, but the mapping does not show a check that it is unique across
      rows. Licence Number is also a licence identifier, not an entity identifier.
    severity: advisory
    suggested_fix: Confirm uniqueness with check_unique on Licence Number, or hash the row if duplicates appear.
