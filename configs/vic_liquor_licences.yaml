needs_transform:
- source: address.state
  why: Every row is a Victorian premises, so address.state should be VIC, but no constant-value transform exists.
    The state is left unmapped until one is available.
source_reliability:
  identity: 0.9
  address: 0.8
  classification: 0.8
  contact: 0.5
source_reliability_basis: 'Liquor Control Victoria is the statutory regulator that issues and records these licences,
  so identity (licensee and trading name) is high. Premises addresses are reliable at the time of the snapshot but
  can go stale, so address is a little lower. The classification score is a publisher-level judgement only: licence
  category is not mapped in this ontology slice, so it is not used by any field. No contact fields are mapped, so
  contact is a neutral 0.5.'
meaning_check_responses:
- check_id: rejected_values_5_of_1755
  action: kept
  reason: The rejections are consistent with postcode value '0', which is not a valid Australian postcode. Rejecting
    it is correct, and the config does not map it to a guessed value.
- check_id: address_full_proposal_disagreement
  action: kept
  reason: Proposal 1 (Street Address joined with Suburb) is kept because it is the complete premises line. Proposal
    2 (Street Address alone) is rejected because it lacks suburb.
- check_id: record_id_not_unique
  action: kept
  reason: Licence Number repeats (20000 distinct across 23169 rows), so hash_row remains true. No other column combination
    was shown to be unique.
- check_id: address_state_missing
  action: kept
  reason: No constant-value transform exists, so address.state stays in needs_transform rather than being guessed.
