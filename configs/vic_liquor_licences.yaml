revision_history:
- round: critique
  changes:
  - what: Removed the address.full field mapped from Street Address.
    why: The reviewer found that Street Address holds only the street line, so emitting it as address.full would
      claim a complete address. The source has no state column, so joining Suburb and Postcode would still not give
      a full address. Under the never-guess rule the field is removed rather than approximated.
  - what: Listed Street Address under unmapped with the reason that the ontology has no street-level field.
    why: 'Account for every column: a column that cannot be mapped correctly goes to unmapped with a reason.'
  - what: Kept Suburb and Postcode mapped to address.locality and address.postcode.
    why: These columns match their canonical meanings and are not affected by the warning. They still carry the
      premises locality and postcode.
