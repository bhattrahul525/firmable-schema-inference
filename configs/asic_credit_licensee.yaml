  critique_issues:
  - id: c-4defdc28
    field: entity.status<-CRED_LIC_STATUS
    problem: CRED_LIC_STATUS records the status of the credit licence (APPR = approved licence, SUSP = suspended
      licence), but the mapping writes it to entity.status, which describes the entity itself. The source does not
      state that the company is active or suspended; a licence can be suspended while the entity is still trading,
      and the reverse is also possible.
    severity: blocking
    suggested_fix: Remove the entity.status mapping for this column, or map it to a licence-status claim if the
      ontology has one. If the ontology must keep entity.status here, record the licence status only as an advisory
      caveat and do not state it as the entity's status.
  - id: c-c7edc7b7
    field: entity.status<-CRED_LIC_STATUS
    problem: The map_values transform covers only APPR and SUSP. Rule 8 requires every raw value visible in the
      profile to be considered, and the config does not show whether other codes (for example cancelled or expired)
      exist in the column or were deliberately left unmapped.
    severity: advisory
    suggested_fix: Confirm the full set of CRED_LIC_STATUS values in the profile and state explicitly how any remaining
      codes are handled.
  - id: c-d93a8e49
    field: entity.legal_name<-CRED_LIC_NAME
    problem: The mapping is justified under rule 5b, since this is a regulator's register and the row's subject
      is the licence holder. The config gives no mapping_confidence, and rule 5b requires 0.7 or lower without an
      explicit label. The column header CRED_LIC_NAME does not itself say 'licensee' or 'registered name'.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.7 or lower for entity.legal_name, citing the register-holder basis,
      or add an explicit confidence value.
  - id: c-20d9dfaa
    field: entity.trading_name<-CRED_LIC_BN
    problem: CRED_LIC_BN is a business name, so trading_name is the right target. The config gives no mapping_confidence,
      and rule 5 caps non-registered name columns at 0.6 or lower.
    severity: advisory
    suggested_fix: Add mapping_confidence of 0.6 or lower to this field.
  - id: c-c1e7b03e
    field: record_id
    problem: record_id is CRED_LIC_NUM, but the config does not show that it was checked for uniqueness. Rule 15
      requires check_unique or hash_row.
    severity: advisory
    suggested_fix: Confirm CRED_LIC_NUM is unique across rows, or fall back to hash_row=true.
  - id: c-b4422b4c
    field: valid_from
    problem: valid_from uses CRED_LIC_START_DT, which is the licence start date. That fits rule 10 for the licence,
      but it is applied to every observation in the row, including name and address claims, which the licence start
      date does not describe.
    severity: advisory
    suggested_fix: Note in the config that valid_from relates to the licence, or restrict it to the licence-related
      observations.
  outcome: validated_config
