  reason: Contract attribute with no ontology field. Only the placeholder 0.
- source: Contract performance management
  reason: Contract attribute with no ontology field. Mostly the placeholder 0.
- source: Contract reference number
  reason: Contract identifier, not unique per row, so not used as record_id. No ontology field.
- source: Contract category group
  reason: Procurement category of the contract, not the supplier's industry. Mapping it to entity.industry_code
    would misclassify the supplier, so it is not mapped.
- source: Parent contract number/SOA
  reason: Contract hierarchy identifier with no ontology field.
- source: Commence date
  reason: Contract period start, not a licence or status start and not a registration date. Not used for valid_from
    per rule 10.
- source: Finish date
  reason: Contract period end, not a licence or status end. Not used for valid_to per rule 10.
needs_transform:
- source: Supplier address
  why: Placeholder value 0 appears in about 15 rows and is not a real address. No transform blanks it, and map_values
    cannot safely map it to absent.
- source: Supplier name
  why: Some multi-supplier cells are comma-separated, for example Slade Health Pty Ltd, Wesley Pharmacy Pty Ltd,
    Baxter Healthcare Pty Ltd. A split on ',' is unsafe because addresses contain commas, so these cells stay unsplit
    and misaligned.
- source: Supplier name
  why: Trading names are embedded as '(t/a ...)', for example heyCKW Pty Ltd (t/a HeyProcurement). Only one sample
    is visible, so the pattern is not yet confirmed as consistent enough for regex_extract into trading_name.
- source: Supplier ABN
  why: Some cells use labelled tokens such as ABN and ACN with '/' separators (Major Medical Equipment Framework
    row), and some use comma-separated lists (Slade row). The ACN values need a label-aware extraction and are not
    mapped to entity.acn.
- source: Supplier address
  why: Comma-separated multi-address cells (Slade row) are not split on ';', so their items cannot be aligned with
    the supplier list.
source_reliability:
  identity: 0.6
  address: 0.5
  classification: 0.3
  contact: 0.4
source_reliability_basis: Statutory-style government procurement disclosure published by Queensland Health, so the
  publisher is authoritative about which supplier and ABN were contracted. Supplier identifiers and names are self-reported
  by agencies and show typos, mixed separators and placeholder values, so identity is moderate. Supplier addresses
  are often incomplete or placeholder, so address is lower. Contract categories are procurement labels rather than
  supplier classifications, so classification is low. No contact fields are present.
