unmapped:
- source: _id
  reason: Completely empty column, ignored.
- source: Agency (Dept or Stat Body)
  reason: Government buyer, not the supplier entity. Not mapped per rule 4. Contains typos such as Queensl;and Health
    and QLD Health Services.
- source: Agency address
  reason: Government buyer address, not the supplier. Not mapped per rule 4.
- source: Contract description/name
  reason: Describes the contract, with no matching ontology field. Some values embed a [MULTI] or site code.
- source: Award contract date
  reason: Date of contract award. It is not a date_registered and not an entity status or licence start, so per
    rule 10 it is not mapped to valid_from.
- source: Contract value
  reason: Contract monetary value, with no ontology field. Contains non-numeric values such as the text '$10,000
