  critique_issues:
  - id: c-2ab382f3
    field: address.full<-Supplier address
    problem: On the ADITS NQ PTY LTD row the Supplier address is the placeholder value "0", which the engine emitted
      as address.full = "0". The source does not state an address, so this claims an address the source does not
      support. The Supplier ABN on that row is single and unspaced, so the when-clause matches and the placeholder
      passes through.
    severity: blocking
    suggested_fix: Add a transform or when-condition that drops placeholder values such as "0" (or any value without
      letters) before mapping to address.full. Do not map a bare "0" as an address.
  - id: c-4954f0a3
    field: entity.legal_name<-Supplier name
    problem: Names such as "Core Connect" and "MAX STOCK'S" read like trading names rather than registered names.
      The supplier column supports legal_name as the contracted supplier, but the names may not be the registered
      entity names.
    severity: advisory
    suggested_fix: Keep legal_name for the supplier column, but set mapping_confidence at or below 0.8 for these
      rows, or cross-check the ABN against a registry before treating the name as registered.
  - id: c-a4fd3b4b
    field: address.full<-Supplier address
    problem: Supplier addresses such as "Level 13, 2 Park Street Sydney, NSW 2000" contain a state and postcode
      that could be parsed into address.state and address.postcode. Only the full string is mapped.
    severity: advisory
    suggested_fix: Optionally parse state and postcode from the address with a deterministic regex transform, and
      map them to address.state and address.postcode.
  - id: c-de28502f
    field: entity.legal_name<-Supplier name
    problem: The split on ';' is never exercised because the when-condition only admits rows with a single Supplier
      ABN, and multi-supplier rows (e.g. the Cleanaway and ALPENGLOW rows) are dropped entirely. The split transform
      is therefore inert in this config.
    severity: advisory
    suggested_fix: Keep the when-condition only if the multi-supplier rows are deliberately excluded and documented.
      Otherwise, split Supplier name, Supplier ABN (abn transform) and Supplier address on ';' in one group so the
      items line up by position, per rule 12.
  - id: c-1e5c883c
    field: entity.abn<-Supplier ABN
    problem: Multi-ABN rows yield zero observations, so every supplier in those rows is lost, not only the ones
      the when-condition excludes. The config records the reason but gives no path to recover the suppliers.
    severity: advisory
    suggested_fix: Add a split-based mapping for multi-ABN rows in the same group as the names and addresses, or
      record these rows as needing a transform so the gap is visible downstream.
  outcome: validated_config
