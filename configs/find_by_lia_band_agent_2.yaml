    severity: advisory
    suggested_fix: Do not emit a default entity_type observation when no source value exists. Leave the field absent
      so the default is applied downstream.
  - id: c-aa8a0a1a
    field: observation envelope
    problem: The example envelopes show only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not shown. Because the licence is required
      and the metadata may not be stated, it must be recorded (or set to 'unknown' and flagged).
    severity: advisory
    suggested_fix: Confirm the full envelope is emitted for every observation, including source_id, source_record_id
      (the hash_row key), ingested_at, licence from the CKAN metadata (or 'unknown' with a flag), and extractor_version.
  - id: c-6eb5ba12
    field: address.full<-Venue Address
    problem: The venue address is kept as one string. The state is not in the source, though it is implied as NSW
      by the dataset. The postcode is absent, and the locality is embedded in the text (for example 'HILLSBOROUGH').
    severity: advisory
    suggested_fix: Parse locality out of the address string where it is reliable, and set address.state from the
      dataset context with a documented derivation level, instead of leaving it empty.
  - id: c-bb511355
    field: entity.trading_name<-Licence Name
    problem: The mapping asserts that Licence Name is a venue name and so a trading name, but several rows carry
      registered-style corporate suffixes ('Charlestown Golf Club Ltd', 'Royal Motor Yacht Club of NSW Limited (Port
      Hacking Branch)', 'Forbes Services Memorial Club Limited'). The source does not state that these are trading
      names, so the mapping may be putting a legal name into trading_name.
    severity: blocking
    suggested_fix: Re-examine what Licence Name denotes (licensee versus venue). If it is the licensee's registered
      name, map it to entity.legal_name, or hold it as an unresolved observation until the source's meaning is confirmed.
      Do not rely on the reason text, which the rows do not support.
  - id: c-38d504fb
    field: observation.valid_from
    problem: valid_from is derived from 'Start Date', which is the liquor/gaming licence start date for the venue.
      It is not stated as the date the entity or trading name became true, so it may not mean what the envelope
      field means.
    severity: advisory
    suggested_fix: Record the source as licence start date in the observation or a note, or leave valid_from null
      unless the source says when the claim became true.
  - id: c-123ae43b
    field: entity.status<-Trading Status
    problem: The map_values rule covers only 'Trading' and 'Temporarily ceased trading'. Any other value will fall
      through unmapped, and 'Temporarily ceased trading' to suspended is a nearest-match judgement rather than a
      stated equivalence.
    severity: advisory
    suggested_fix: Add an explicit fallback to unknown for unmapped values and note in the config that the suspended
      mapping is an approximation.
  - id: c-3b4c7c05
    field: observation envelope
    problem: The example envelopes show only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible in the examples, so the envelope
