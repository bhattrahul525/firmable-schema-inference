      as the claim start.
    severity: advisory
    suggested_fix: Label the value as licence start in the reason, or map it only to a licence-scoped observation
      rather than to the entity-level envelope.
  - id: c-688d1cb4
    field: observation envelope
    problem: The example observation envelopes show only observed_at, valid_from and valid_to. The required fields
      source_id, source_record_id, licence, ingested_at and extractor_version are not visible. The record_id hash_row
      approach is also not described beyond the config key.
    severity: advisory
    suggested_fix: Confirm the emitted envelope carries all required fields. Set licence from the CKAN metadata,
      or 'unknown' with a flag if absent. Document the row-hash construction for source_record_id.
  - id: c-afd79b75
    field: entity.entity_type
    problem: Every example emits entity_type 'unknown' with from null. This is the correct default under the ontology,
      but the Type column (club, hotel) and the 'Ltd' suffix in names are not used even as weak evidence.
    severity: advisory
    suggested_fix: Keep unknown as the default. Optionally record Type as a raw premises-type attribute (not entity_type)
      so it is preserved for later use.
  - id: c-ad1f162e
    field: entity.status<-Trading Status
    problem: The map_values rule sends 'Temporarily ceased trading' to 'suspended'. The source only says the venue
      has temporarily stopped trading. 'Suspended' is a stronger status, and the config's own reason calls it the
      'nearest enum value', which means it is a stand-in rather than a meaning the source states.
    severity: blocking
    suggested_fix: Do not map 'Temporarily ceased trading' to 'suspended'. Map it to 'unknown' and keep the raw
      value, or add an advisory note that it describes a venue trading state, not an entity status.
  - id: c-56224767
    field: observation.valid_from
    problem: In every example, valid_from is set from the 'Start Date' column, which is the liquor/gaming licence
      start date. The config does not declare this source, and the date is not the date the entity or venue name
      became true. Using it as valid_from is an undocumented mapping that could be read as the company's start date.
    severity: advisory
    suggested_fix: Declare Start Date in the config as a licence-date mapping, or leave valid_from null. If it is
      kept, note in the reason that it is the licence grant date.
  - id: c-d0bc4243
    field: entity.entity_type
    problem: 'An entity_type observation of ''unknown'' is emitted for every row with from: null. This is a default
