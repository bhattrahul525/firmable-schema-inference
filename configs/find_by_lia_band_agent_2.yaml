  critique_issues:
  - id: c-f51119bd
    field: entity.legal_name<-Licence Name
    problem: The source column is the name on the liquor/gaming licence for a venue, e.g. 'Milton Hotel', 'Wests
      Mayfield', 'Dangar Island Bowling Club'. Nothing in the source states it is the registered legal name. The
      ontology defines legal_name as 'As registered. Not the trading name', and the venue name reads as a trading
      or premises name. The reason's 'treated as the licensee's name' is an assumption the source does not support.
    severity: blocking
    suggested_fix: Do not map Licence Name to entity.legal_name. Map it to entity.trading_name (L0, as stated on
      the licence), or leave entity names unmapped and keep the licence name as a venue-level observation with a
      caveat that it is not a registered name.
  - id: c-a8d39fd1
    field: entity.status<-Trading Status
    problem: '''Trading'' is mapped to active. The source says the venue is currently trading, which is a narrower
      claim than the entity being an active registered company. The mapping also treats licence status as entity
      status.'
    severity: advisory
    suggested_fix: Keep the mapping but note the caveat, or emit it as a venue-trading observation. Consider a separate
      field rather than entity.status if the ontology allows.
  - id: c-a890fdab
    field: entity.status<-Trading Status
    problem: '''Temporarily ceased trading'' is mapped to suspended. The source wording describes a trading state,
      not a regulatory suspension of the entity, so the nearest enum value is a judgement call.'
    severity: advisory
    suggested_fix: Accept as nearest value, but record field_confidence below 1 and derivation_level L1 for this
      transform, or map to unknown if strictness is preferred.
  - id: c-78ff33a4
    field: address.full<-Venue Address
    problem: The locality (e.g. 'HILLSBOROUGH', 'BURRANEER') and the state are embedded in the free-text address
      and are not parsed. State is implied NSW by the dataset but not stated per row, and postcode is absent.
    severity: advisory
    suggested_fix: Add parsed locality as an L1 derivation from the trailing uppercase token. Set address.state
      to NSW only with a caveat that it comes from the dataset scope, not the row.
  - id: c-d60ce38d
    field: observation.valid_from
    problem: valid_from is taken from 'Start Date', which is the liquor/gaming licence start date for the venue,
