  - id: c-34d29255
    field: address.full<-Venue Address
    problem: Venue addresses carry a locality and sometimes a postcode-less suburb in capitals (e.g. '1A Barker
      Ave HILLSBOROUGH'), but state and postcode are not parsed. The data is all NSW or regional NSW, which is derivable
