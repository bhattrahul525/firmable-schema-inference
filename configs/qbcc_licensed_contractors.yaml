  critique_issues:
  - id: c-02975ddc
    field: address.state<-Licensee Business Address
    problem: The state regex is case-sensitive and only matches uppercase abbreviations, so for row 81888 ('18 Penlington
      Street Allenstown Qld 4700') no address.state observation is produced even though the source states Queensland.
      The postcode still maps, so the gap is incompleteness, not a wrong value.
    severity: advisory
    suggested_fix: Make the regex case-insensitive (e.g. prefix with (?i)) and keep state_code to normalise to uppercase,
      then re-check row 81888.
  - id: c-22d0bd3d
    field: industry_code
    problem: Licence Class Type holds work-class descriptions such as 'Painting and Decorating', 'Carpentry' and
      'Builder - Medium Rise'. It is unmapped on the grounds that it is not ANZSIC, but rule 9 says to map the source's
      own code or description as it is, without translating it to ANZSIC. The ontology's industry_code note says
      to record the raw source value too. The exclusion may be too strict.
    severity: advisory
    suggested_fix: Consider mapping Licence Class Type to entity.industry_code as the raw description, with a caveat
      that it is a licence class and not an ANZSIC code; otherwise keep it unmapped with the reason stated more
      precisely.
  - id: c-c2eeb118
    field: record_id
    problem: The config uses the id column for record_id but does not state that it was checked for uniqueness.
      The rule requires check_unique or hash_row.
    severity: advisory
    suggested_fix: Confirm id is unique across the file (check_unique) before relying on it as source_record_id.
