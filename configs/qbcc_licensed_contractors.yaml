unmapped:
- source: Licence Number
  reason: Per-licence identifier. Ontology v0.1 has no licence-number field, and it is not an entity identifier,
    so it is not mapped.
- source: Licence Type CODE
  reason: Duplicate of Licence Type DESC (I/C codes). Carries the same Individual/Company split; the Company mapping
    is carried by Licence Type DESC, so this duplicate is not mapped.
- source: Financial Category DESC
  reason: Regulatory financial-category classification. Ontology v0.1 has no field for it.
- source: Financial Category CODE
  reason: Code form of Financial Category DESC. Ontology v0.1 has no field for it.
- source: Licence Grade
  reason: Licence grade (builder, trade contractor, supervisor, etc.) is a licence attribute, not an entity status
    or industry code. Ontology v0.1 has no field for it.
- source: Licence Class Type
  reason: Licence class (e.g. Carpentry, Builder - Open) is a regulatory authorisation category, not an ANZSIC industry
    code. Rule 9 forbids translating it, and the ontology has no licence-class field, so it is not mapped to industry_code.
- source: Licence Type DESC
  reason: 'abstained (entity.entity_type): still failing after 2 revision(s): parse rate 21% is below 90%'
needs_transform:
- source: Licensee Business Address
  why: Locality (suburb/town) is embedded in the free-text address with no delimiter before it. The street portion
    varies in format (e.g. 'Shed 2 58 Islander Rd Pialba', 'Torbanlea Torbanlea QLD 4662'), so no existing transform
    can isolate it reliably. Requires a locality-extraction transform before address.locality can be mapped.
source_reliability:
  identity: 0.9
  address: 0.8
  classification: 0.85
  contact: 0.6
source_reliability_basis: QBCC is the statutory licensing regulator for Queensland building and construction, so
  its register is high-trust for licence identity and classification (licence class, grade, financial category).
  Business addresses are self-reported by licensees, so address trust is lower. Contact details are not in the dataset,
  so contact is set low. Licensee names are as recorded by the regulator, which is good for identity but may vary
  in case and format across rows.
meaning_check_responses:
- check_id: entity.entity_type<-Licence Type DESC
  action: changed
  reason: Parse rate 21% below 90% due to Individual values (236 rejections) having no valid ontology mapping without
    guessing. Removed the field and listed the column under unmapped; the engine will record entity_type as unknown
    per rule 7.
- check_id: entity_type_explicit_column
  action: changed
  reason: Licence Type DESC is an explicit entity-type source column. Company rows now map to company via map_values;
    Individual values are left out so they are rejected and recorded as unknown, avoiding the sole_trader guess.
revision_history:
- round: r1
  changes:
  - what: Removed the entity.entity_type field (map_values on Licence Type DESC) from fields.
    why: 'Hard failure: parse rate 21% against a 90% minimum, with 236 Individual rejections. Individual has no
      ontology value that fits without guessing (rule 4 forbids inferring sole_trader), and mapping it to unknown
      would inflate the parse rate with a default rather than a real mapping.'
  - what: Moved Licence Type DESC from fields to unmapped with a reason.
    why: 'Rule 2 and the failure instruction: a field that cannot be made to work is removed and its column listed
      under unmapped. Company alone would not clear the parse-rate threshold.'
  - what: Updated the Licence Type CODE unmapped reason.
    why: The previous reason said DESC was mapped to entity_type, which is no longer true.
- round: critique
  changes:
  - what: 'Added entity.entity_type field sourced from Licence Type DESC using map_values {"Company": "company"}
      only.'
    why: The source has an explicit entity-type column. Company rows are unambiguous and were previously left as
      the engine default 'unknown' although the source states the type. Rule 7 permits map_values on an explicit
      column.
  - what: Removed Licence Type DESC from unmapped.
    why: The column is now used in fields (entity.entity_type), so rule 3 is satisfied by the field mapping rather
      than an unmapped entry.
  - what: Individual values are deliberately not in the map_values table.
    why: Individual has no ontology equivalent for natural-person licensees; mapping it to sole_trader would be
      a guess (rule 4), and mapping it to unknown would count the engine default as a parsed value. Rejection leaves
      these rows as unknown.
  - what: No other fields changed.
    why: The reviewer raised only the entity_type issue; the remaining mappings, record_id, observed_at and reliability
      scores were not challenged by the report.
