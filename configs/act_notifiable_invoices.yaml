- source: supplier_abn
  canonical: entity.abn
  transforms:
  - name: abn
    arg: null
  group: main
  mapping_confidence: 0.85
  reason: Column is named supplier_abn and about 99.6 percent of values are 11-digit numbers. Values are space-grouped
    (e.g. 83 121 852 088); spaced values were observed to produce valid entity.abn observations in tested rows (e.g.
    11 000 013 098 gives 11000013098). Non-ABN values such as International are skipped by the abn transform and
    remain unmapped. Checksum validation is applied.
  proposal_agreement: agreed
  field_confidence: 0.85
  validation:
    held_out_rows: 300
    blank: 0
    ok: 298
    skipped_not_applicable: 2
    rejected: 0
    parse_rate: 1.0
- source: supplier_name
  canonical: entity.entity_type
  transforms:
  - name: entity_type_from_suffix
    arg: null
  group: main
  mapping_confidence: 0.6
  reason: The source has no explicit entity-type column, so the suffix rule on the supplier name is used. Names
    without a company suffix, such as trusts and bodies, resolve to unknown.
  proposal_agreement: agreed
  field_confidence: 0.6
  validation:
    held_out_rows: 300
    blank: 0
    ok: 300
    skipped_not_applicable: 0
    rejected: 0
    parse_rate: 1.0
unmapped:
- source: reporting_entity
  reason: Government buyer (ACT agency or directorate reporting the payment), not the supplier. Not mapped per rule
    4.
- source: publish_description
  reason: Describes the purchase or expense category, not the supplier's industry. No canonical field matches. Not
    translated to ANZSIC.
- source: date_invoice_received
  reason: Invoice receipt date is a transaction date, not a registration or licence validity date. No canonical
    field matches. Sparsely filled at about 85 percent.
- source: payment_date
  reason: Payment transaction date. No canonical field matches, and it does not state when a supplier's status or
    licence started or ended.
- source: payment_amount
  reason: Transaction amount. No canonical amount field exists in this ontology subset.
- source: contract_number
  reason: Contract reference for the payment. No canonical field matches. Mostly blank, with N/A values.
- source: :version
  reason: System or export revision identifier. Not a claim about the entity.
- source: :created_at
  reason: System export timestamp. Not the statement date of the claim, which is covered by observed_at from resource_last_modified.
- source: :updated_at
  reason: System export timestamp. Not the statement date of the claim, which is covered by observed_at from resource_last_modified.
