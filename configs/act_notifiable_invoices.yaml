  critique_issues:
  - id: c-5c1dd88a
    field: observed_at
    problem: observed_at comes from resource_last_modified, which is a dataset-level timestamp. The rows carry :created_at
      and :updated_at, which the config treats as system timestamps, so the claim date is not stated per row. The
      envelope's 2026-09-30 is therefore a metadata date, not a date the payment record states.
    severity: advisory
    suggested_fix: Keep from_metadata if the dataset-level date is the best available statement date, and note in
      the source documentation that observed_at is the publication/modification date rather than a claim date.
  - id: c-5b9ec2a9
    field: record_id
    problem: The config takes record_id from :id but does not show a check_unique result. The sample :id values
      look unique, but the config does not confirm it.
    severity: advisory
    suggested_fix: Record the check_unique result for :id, or use hash_row=true if uniqueness fails.
