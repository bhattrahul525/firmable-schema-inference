    arg: null
  group: main
  mapping_confidence: 0.85
  reason: Supplier name on a government payment register. The data says it is the supplier name, which we treat
    as the registered name. Not verified against a company register, so confidence is below 0.9.
  proposal_agreement: agreed
  field_confidence: 0.85
  validation:
    held_out_rows: 300
    blank: 0
    ok: 300
    skipped_not_applicable: 0
    rejected: 0
