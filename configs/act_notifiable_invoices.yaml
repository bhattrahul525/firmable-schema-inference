source_reliability_basis: Statutory ACT government disclosure of payments above the notification threshold. Supplier
  names and ABNs come from government accounts-payable records, not a verified register, so identity is moderate.
  There is no address or contact data. Classification is weak because publish_description describes spend, not the
  supplier's industry. Licence is listed as Other and flagged, so it is not a clear open licence.
