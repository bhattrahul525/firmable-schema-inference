what_it_is: 'ACT Government Notifiable Invoices Register: a JSON export of invoices/payments made by ACT government
  agencies to suppliers above the notification threshold.'
one_row_is: one notified invoice payment from an ACT government reporting entity to a supplier
reader:
  format: json
