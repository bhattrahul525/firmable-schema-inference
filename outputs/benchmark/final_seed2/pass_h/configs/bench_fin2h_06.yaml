  critique_issues:
  - id: c-be3cc3d9
    field: valid_from
    problem: valid_from is sourced from BD_ORG_START_DT, which records the start date of a banning order, an event
      against the organisation. The envelope applies it to the entity.legal_name and entity.acn observations, so
      the output claims the registered name and ACN became true on the ban date. Rule 10 says an event date the
      row records is not when a name or identifier became true, and the register does not state when the organisation's
      registration started.
    severity: blocking
    suggested_fix: Remove valid_from and valid_to from the envelope for the name and ACN observations. If the ban
      itself is to be recorded, map it to a status-type field with its own basis, not to the envelope dates of the
      identity fields.
  - id: c-3bf1bd13
    field: valid_to
    problem: valid_to is sourced from BD_ORG_END_DT, the end of a banning period. It is applied to the identity
      observations (legal_name, acn) and states that the organisation's registration or name ended on that date.
      The source does not say this.
    severity: blocking
    suggested_fix: Do not apply valid_to to name or ACN observations. Drop it, or confine it to a status-level claim
      whose meaning is the banning period.
  - id: c-d37d91f5
    field: entity.legal_name<-BD_ORG_NAME
    problem: The rule 5b basis is stated in the reason, but the config has no label in the source saying BD_ORG_NAME
      is the registered name. The register does list the organisation as holding the banning, so the mapping is
      supportable, but the confidence should be 0.7 or lower without a label.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.7 or lower for entity.legal_name, citing the 5b basis.
  - id: c-a7a65fc8
    field: entity.legal_name<-BD_ORG_NAME
    problem: Some values carry a former name inside the value, e.g. 'KNIGHTSBRIDGE FINANCE PTY LTD (Formerly CLIFTON
      PARTNERS FINANCE PTY LTD)'. The whole string goes into legal_name, so the former name is presented as part
      of the registered name.
    severity: advisory
    suggested_fix: Leave as is under rule 1 (no added or removed text), but record this as a caveat. A later regex_replace
      could split the former name out, but only if the rule permits removing text from the value.
  - id: c-b331738f
    field: observation.licence
    problem: The config has no licence entry. The envelope requires a licence value from dataset metadata, and none
      is given for this register.
    severity: advisory
    suggested_fix: Take the licence from the CKAN metadata for this resource, or record 'unknown' and flag it.
  outcome: validated_config
