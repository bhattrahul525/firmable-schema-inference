      rows, where the supplier appears only in CDContractSummary. The mapping does not recover it.
    severity: advisory
    suggested_fix: Consider a richer rule for generic Contract values, or record the supplier name from CDContractSummary
      as a low-confidence trading name only where the leading organisation name is clear.
  - id: c-4c17c843
    field: entity.legal_name<-CDContractSummary
    problem: CDContractSummary often begins with a full company name ending in 'Pty Ltd' (e.g. 'Hewlett-Packard
      Australia Pty Ltd'), which may be the registered name. The config leaves it unmapped, and the source does
      not label it as registered, so this is a judgement call rather than an error.
    severity: advisory
    suggested_fix: Keep it unmapped unless the dataset documents that the leading name is the registered supplier
      name. If it is later parsed, extract only the leading company name and map it at low confidence.
  - id: c-9f014a5c
    field: entity.trading_name<-Contract
    problem: 'The Contract column holds short supplier names such as Hewlett-Packard, Dell, Microsoft, AAPT and
      Nextgen Networks, which the source does not label as registered names. Mapping them to trading_name at low
      confidence follows rule 5, so this is not blocking. The exclusion regex is broad, though: it drops any row
      whose Contract value contains ''Agreement'', ''Panel'', ''Deed'', ''Arrangement'' or ''Suppliers'', which
      would also drop a genuine supplier name containing one of those words.'
    severity: advisory
    suggested_fix: Keep trading_name at 0.6 or lower. Consider anchoring the exclusion on the generic labels only
      (for example exact matches for 'Software Suppliers' and 'eProjects Panel') so that real supplier names are
      not silently skipped.
  - id: c-0a0c339d
    field: entity.legal_name
    problem: The CDContractSummary column often begins with a full corporate name such as 'Hewlett-Packard Australia
      Pty Ltd', 'Dell Australia Pty Ltd' and 'Nextgen Networks Pty Limited', which looks like a registered supplier
      name. It is unmapped because the source does not label it as the registered name, which is a defensible choice
      under rule 2. The 'Pty Ltd' suffix does show the name is a company name, so a candidate legal_name could be
      recorded later at low confidence.
    severity: advisory
    suggested_fix: Leave CDContractSummary unmapped for now, or record a low-confidence legal_name candidate only
      after a deterministic extraction of the leading company name before the product description. Document the
      extraction rule if you do this.
