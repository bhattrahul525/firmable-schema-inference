    severity: advisory
    suggested_fix: Set mapping_confidence to 0.7 or lower for entity.legal_name<-Business Name, and note in the
      reason that it is mapped under the licence-holder rule (5b).
  - id: c-b2ed6a30
    field: observed_at
    problem: observed_at uses downloaded_at from metadata. Rule 11 says a snapshot register should use resource_last_modified,
      because downloaded_at is when we fetched the file, not when the source stated the claim.
    severity: advisory
    suggested_fix: Change observed_at to from_metadata resource_last_modified, or justify keeping downloaded_at
      as the statement date.
  - id: c-e17246bf
    field: entity.legal_name<-Business Name
    problem: The mapping relies on rule 5b, which requires the row subject to be the licence holder. The data does
      not show that the Business Name is the holder rather than a trading or premises name, and the config's own
      reason admits the column is not labelled as the registered name. Rows such as 'Carpentry Services 12 Pty Ltd'
      fit a holder name, but the dataset metadata should confirm it.
    severity: advisory
    suggested_fix: Confirm from the register's documentation that the Business Name column records the licence holder.
      Keep mapping_confidence at 0.7 or lower and record the basis for the mapping in the config.
  - id: c-4ce6cde2
    field: entity.status
    problem: Licence Status (Current/Expired) is left unmapped. This is a reasonable call, but the register's status
      information is then lost for the entity-level view.
    severity: advisory
    suggested_fix: Keep it unmapped unless the register documents that licence status reflects the holder's status.
      Consider a licence-level field if the ontology gains one.
