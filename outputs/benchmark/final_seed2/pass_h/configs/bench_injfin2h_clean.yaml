  - id: c-85551373
    field: entity.legal_name<-Business Name
    problem: The source column is literally labelled 'Business Name', and rule 5 names 'business name' as the marker
      for trading_name. The config maps it to legal_name on the strength of the register context alone. Rule 5b
      only permits legal_name for a holder-of-licence register at confidence 0.7 or lower, and the config states
      no such confidence. The mapping therefore asserts a registered name the source does not state.
    severity: blocking
    suggested_fix: Map 'Business Name' to entity.trading_name at confidence 0.6 or lower. If the team wants legal_name,
      it needs a column that is labelled as the licensee or registered name, or a documented 5b mapping at confidence
      0.7 or lower with the holder basis stated.
  - id: c-089c4159
    field: entity.legal_name<-Business Name
    problem: No mapping_confidence or source_reliability is given for the name claim, and the 5b holder basis is
      only implied by the reason text.
    severity: advisory
    suggested_fix: Add mapping_confidence and source_reliability with a basis for the claim kind, and state explicitly
      that the register lists the row's subject as the licence holder.
  - id: c-6456b3ac
    field: observation.licence
    problem: The config does not record the dataset licence, so the envelope cannot be completed from the mapping.
    severity: advisory
    suggested_fix: Take the licence from the CKAN metadata, or record 'unknown' and flag it as a finding.
  - id: c-6990568e
    field: entity.trading_name<-Business Name
    problem: The sample names all end in 'Pty Ltd', a registered company form. That suggests these may be registered
      names held by a licence holder, so trading_name may understate them. Rule 5b only allows legal_name with an
      explicit label, so trading_name is the defensible choice, but mapping_confidence should be 0.6 or lower and
      the caveat should be recorded.
    severity: advisory
    suggested_fix: Keep trading_name, set mapping_confidence to 0.6 or lower, and note in the reason that the 'Pty
      Ltd' suffix suggests the registered name and that the register does not label the column as the licensee name.
  - id: c-d6de8da5
    field: observation.licence
    problem: The config does not show a licence value for the dataset, and the envelope requires one. Nothing in
