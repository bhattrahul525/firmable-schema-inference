  critique_issues:
  - id: c-33ed8a49
    field: address.full<-Street_Address_Line_1
    problem: In the Adelaide Drumming row the source value is 'Locations in the City of Onkaparinga', which describes
      a set of locations and is not a street address. Mapping it to address.full states an address the source does
      not support. In the ADRA row the value is 'ADRA SA,', an organisation label, while the actual street ('31
      Prospect Rd') sits in Street_Address_Line_2. The mapped value there is not the street address.
    severity: blocking
    suggested_fix: Make address.full conditional so it maps only rows whose Street_Address_Line_1 holds a street
      address (for example by excluding non-address text), or drop the field for this column. Map Street_Address_Line_2
      to address.full where it holds the street, or document why it is left out.
  - id: c-2a24c2ea
    field: Street_Address_Line_2
    problem: Street_Address_Line_2 is listed as unmapped with the reason 'Secondary address detail'. In the ADRA
      row it holds the actual street address, so the stated reason does not match the data.
    severity: advisory
    suggested_fix: Revisit the unmapped reason. Consider a conditional mapping of Street_Address_Line_2 to address.full
      for rows where Line 1 is not a street address.
  - id: c-b1b2ebd2
    field: address.full<-Street_Address_Line_1
    problem: In the Goodstart row the value includes the business name ('Goodstart Early Learning Plympton, 247-251
      Anzac Hwy'). The street part is correct, but the claim includes non-address text.
    severity: advisory
    suggested_fix: Accept as a source-stated value with a caveat, or parse out the street portion with a transform
      that removes text without adding any.
  - id: c-f91460a6
    field: record_id
    problem: record_id uses hash_row=true, but ID_19 appears to be a unique directory-internal identifier on every
      row shown. Rule 15 prefers a check_unique column when one exists.
    severity: advisory
    suggested_fix: If ID_19 is confirmed unique across the file, use record_id on ID_19 with check_unique and keep
      hash_row only as a fallback.
  - id: c-47af2a63
    field: address.country
    problem: Country is unmapped as 'Always Australia'. The directory's own metadata may support a constant for
      the jurisdiction, but no basis is recorded for it.
    severity: advisory
    suggested_fix: Leave address.country unmapped unless the dataset metadata or title states that the directory
      covers every row. If it does, document that basis in a constant mapping anchored on a column filled on every
      row.
