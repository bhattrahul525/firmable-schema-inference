  critique_issues:
  - id: c-78b5105b
    field: entity.legal_name<-SMSF_NAME
    problem: Under rule 5b the name is the register holder's name, but the config gives no mapping_confidence. Without
      an explicit registered-name label, rule 5b caps confidence at 0.7 or lower, and the config does not show that
      cap.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.7 or lower for entity.legal_name<-SMSF_NAME and state in the reason
      that the name is the approval holder's name under rule 5b.
  - id: c-4b3f94d6
    field: entity.legal_name<-SMSF_NAME
    problem: The `when` clause restricts the legal name to rows with a valid 11-digit SMSF_PERSON_ABN. The register
      subject is the auditor whether or not an ABN is present, so auditors without an ABN lose their name with no
      stated reason.
    severity: advisory
    suggested_fix: Either justify the ABN restriction in the reason or map the name on every row that has a SMSF_NAME,
      keeping the abn field restricted to ABN rows.
  - id: c-6d3bc31c
    field: record_id
    problem: Each auditor has one row per condition or capacity line, and the entity-level columns repeat on each.
      The Yibo Wang example yields two rows with identical entity observations (abn, legal_name, status, date_registered,
      address), so the same claim is emitted more than once.
    severity: advisory
    suggested_fix: Consider deduplicating entity-level observations on SMSF_NUM or SMSF_PERSON_ABN, or document
      that repeated rows are intentional, so the same claim is not counted twice.
  outcome: validated_config
