  critique_issues:
  - id: c-79057634
    field: entity.legal_name<-Org_name
    problem: 'Org_name comes from a community directory, not a regulator register, and nothing in the data says
      it is the registered name. Many values are not registered entities: ''RSPCA Op Shop - Brighton'' (a shop),
      ''Port Elliot Rotary Market'' (an event), ''Ryan Mitchell Swim Centre'' (a council facility), ''Multiple Sclerosis
      Society Peer Support Group - Southern'', and a Centacare service program. Their parent bodies are in Parent_Body.
      Rule 5 says any other name column maps to trading_name at 0.6 or lower, not legal_name.'
    severity: blocking
    suggested_fix: Map Org_name to entity.trading_name with mapping_confidence of 0.6 or lower. Do not map it to
      legal_name.
  - id: c-b6676c2f
    field: entity.abn<-Organisati_ABN
    problem: The ABN is mapped correctly with the abn transform, but where the row is a facility of a parent body
      (e.g. Eldercare Evanston Park, ABN 63758127271, parent Eldercare Inc.), the ABN may belong to the parent rather
      than the named row.
    severity: advisory
    suggested_fix: Keep the mapping and lower mapping_confidence slightly.
  - id: c-6844234e
    field: address.state<-State
    problem: In the Centacare row the street State and Suburb are blank, and the row has only a postal address (State__2,
      Suburb__2). Postal_Code (5608) is therefore mapped without a street suburb or state, which leaves the address
      incomplete.
    severity: advisory
    suggested_fix: Accept the gap, or note that postal fields are not mapped.
  - id: c-b5c22b8a
    field: unmapped
    problem: The 'Other columns' entry is too vague for rule 3. Organisation_Last_updated is a per-row statement
      date that could support observed_at. Parent_Body, the contact columns and the category columns are all lumped
      together.
    severity: advisory
    suggested_fix: List each column with its own reason. Consider using Organisation_Last_updated as the per-row
      observed_at, parsed with parse_date.
  - id: c-e3dd43a3
    field: entity.legal_name<-Org_name
    problem: Org_name is a community directory listing name, not labelled as the registered name, and the dataset
      is not a regulator register. Many values are not registered entities but venues, shops, programs or sub-units
      (e.g. 'RSPCA Op Shop - Brighton', 'Port Elliot Rotary Market', 'Ryan Mitchell Swim Centre', 'Centacare ...
      Homelessness Service (Youth Focus)'). Under rule 5 these should be trading_name at 0.6 or lower, or legal_name
      at 0.7 or lower.
    severity: advisory
    suggested_fix: Keep the mapping but set mapping_confidence to 0.6 or lower, or map to entity.trading_name. Note
      that the names are directory listing names.
  - id: c-c2391f36
    field: entity.abn<-Organisati_ABN
    problem: The ABN is the ABN of the organisation that owns the listing, not necessarily of the named venue or
      sub-unit. For example, Eldercare Evanston Park carries an ABN that probably belongs to the parent, Eldercare
      Inc. The ABN mapping is correct and follows the abn transform rule.
    severity: advisory
    suggested_fix: Keep the abn mapping with moderate confidence. Optionally note that ABN may belong to a parent
      body.
  - id: c-7bce06c7
    field: address.locality<-Suburb
    problem: Suburb may not reflect a street address. In the MS Society example the Suburb value 'Onkaparinga' is
      a council area rather than a suburb. The Street_Address_Line columns are unmapped, so no address.full is produced.
    severity: advisory
    suggested_fix: Optionally map the Street_Address_Line_1 and Street_Address_Line_2 columns to address.full or
      leave them unmapped with a reason. Lower the confidence for locality.
  - id: c-73addd84
    field: unmapped
    problem: Many columns are listed as 'abstained by the harness', so they are not properly accounted for with
      real reasons. Parent_Body, Primary_Category, Organisation_Last_updated and Website_2/3 are examples. The Primary_Category
      and Directory columns could be industry_code under rule 9.
    severity: advisory
    suggested_fix: Give each column a real reason, or map Primary_Category as industry_code with raw source value.
      Organisation_Last_updated is not a valid_from date, since it is a listing update.
