      null.
  - id: c-b3ce6bdb
    field: entity.legal_name<-BD_ORG_NAME
    problem: Some names embed a former name, e.g. 'KNIGHTSBRIDGE FINANCE PTY LTD (Formerly CLIFTON PARTNERS FINANCE
      PTY LTD)'. The legal_name claim therefore contains extra text beyond the registered name. This follows the
      register-holder rule, but the value is not a clean legal name.
    severity: advisory
    suggested_fix: Keep the mapping, but note the caveat. Optionally use regex_replace to strip the '(Formerly ...)'
      text, or leave it as a raw claim. Consider mapping_confidence of about 0.8.
