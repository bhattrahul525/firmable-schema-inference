      The licence lifecycle is not captured anywhere.
    severity: advisory
    suggested_fix: Keep Status unmapped. Optionally note that licence expiry is covered by valid_to where End Date
      is present.
  - id: c-0db5111c
    field: valid_from<-Commenced Date
    problem: Commenced Date and End Date are only filled on a few rows (e.g. the TEL1008... rows), so most rows
      have null valid_from/valid_to. For rows with 'Expired' status and only an Issued Date, the licence start is
      not captured. This is incompleteness, not an error.
    severity: advisory
    suggested_fix: Leave as is. Issued Date should stay unmapped because it is an issue event date, not a start
      date for the holder's licence.
