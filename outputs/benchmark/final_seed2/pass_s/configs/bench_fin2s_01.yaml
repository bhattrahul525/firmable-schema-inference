  - id: c-17b0802f
    field: valid_from
    problem: valid_from is mapped from SMSF_REG_DT, the same column as entity.date_registered. The column does state
      when the auditor's registration started, so this is supported, but it duplicates date_registered. Registration
      start is not necessarily when the name, ABN or address became true.
    severity: advisory
    suggested_fix: Keep it if registration start is accepted as valid_from. Otherwise drop valid_from and keep only
      entity.date_registered.
  - id: c-0e8281b3
    field: entity.status<-SMSF_STATUS
    problem: map_values covers only Registered and Suspended. Other values the register may hold (e.g. Removed,
      Disqualified, Cancelled) are unmapped and would be lost.
    severity: advisory
    suggested_fix: Add mappings for every status value in the profile that has a clear meaning, e.g. a cancelled
      or removed status mapped to deregistered.
  - id: c-aaf21a45
    field: entity.legal_name<-SMSF_NAME
    problem: Under rule 5b a regulator register without an explicit label for the name column should have mapping_confidence
      of 0.7 or lower. The reason cites a regulator register and holder of auditor registration, but SMSF_NAME carries
      no explicit registered-name label.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.7 or lower for SMSF_NAME.
