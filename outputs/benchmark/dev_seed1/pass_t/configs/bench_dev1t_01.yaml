  - id: c-b6744d78
    field: entity.abn<-SMSF_PERSON_ABN
    problem: The config maps SMSF_PERSON_ABN, but none of the example raw rows contains that column and no abn observations
      appear, so the mapping cannot be checked against the data. The column is probably empty or absent in the sample.
    severity: advisory
    suggested_fix: Confirm that SMSF_PERSON_ABN exists in the source and carries ABNs. If it does not, drop the
      mapping or move the column to unmapped.
  - id: c-3b4c2e37
    field: valid_from
    problem: The envelope valid_from equals SMSF_REG_DT (the registration date) in every example, but the config
      declares no valid_from. It appears to have been derived from date_registered, and the rows are Capacity or
      Condition rows with their own start dates. Registration date and validity of the claim may not be the same
      thing.
    severity: advisory
    suggested_fix: Declare valid_from explicitly, or leave it null if the source does not state when the status
      began.
  - id: c-d7f3007a
    field: entity.status<-SMSF_STATUS
    problem: The map_values transform covers only Registered and Suspended. Other raw values, such as cancelled
      or disqualified, would be unmapped. The suspension start and end dates are left unmapped.
    severity: advisory
    suggested_fix: Add mappings for any other values seen in the profile. Consider using the suspension dates for
      valid_from and valid_to when the status is suspended.
  - id: c-f93899de
    field: record_id
    problem: The register has multiple rows per auditor (Capacity and Condition attribute rows), so SMSF_NUM is
      not unique per row. Hash_row is acceptable, but the repeated rows produce duplicate observations for the same
      auditor.
    severity: advisory
    suggested_fix: Keep hash_row, or use SMSF_NUM with the attribute columns as a composite key. Note that duplicate
      observations will occur.
