validation_summary:
  held_out_rows: 300
  observations_in_held_out: 1258
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-be3eb6df
    field: entity.legal_name<-party_name
    problem: Some party_name values are hashed placeholders (e.g. 'ta57f5531260dc9c620e39d8186866334', 't9a96fb196ce01c7bdadcdb947ea2fb45')
      rather than real names, so they are emitted as legal_name claims that carry no usable name. Names are also
      lowercased in the source.
    severity: advisory
    suggested_fix: Keep the mapping but note that anonymised hash-like names exist in the source. Downstream, treat
      such values as low-quality and lower field confidence or filter them out.
  - id: c-3bb6d0f3
    field: lord_party_id
    problem: lord_party_id is unmapped, yet when lord_party_id_type is 'abn' (e.g. 39010587498.0) it holds an 11-digit
      ABN. The rules say to use the abn transform for ABNs, so a usable identifier is being dropped. The column
      mixes ABNs with internal party_ids, and the values carry a '.0' float suffix.
    severity: advisory
    suggested_fix: If the engine supports conditional mapping on lord_party_id_type, map ABN rows with the abn transform.
      Otherwise list it under needs_transform, with the reason that the identifier type depends on another column.
  - id: c-4d532d94
    field: address.state<-state_code
    problem: Non-Australian state values such as 'tortola' (country VG) and 'oh' (country US) are not valid values
      in the AU state enum, so they are dropped with no observation. Foreign state information is lost.
    severity: advisory
    suggested_fix: Accept the dropping as expected, but note that the state enum covers only Australia and NZ. Optionally
      keep the foreign state value in a free-text field.
