  critique_issues:
  - id: c-54b16c0a
    field: valid_from/valid_to (Action Date, Action End Date)
    problem: The envelope carries valid_from and valid_to taken from Action Date and Action End Date, but the config
      shown has no entry for them and does not list those columns as unmapped. The dates are in the output, so they
      are accounted for somewhere, but the config does not document the mapping. For a suspension or condition they
      describe the action period, not the licence or entity status.
    severity: advisory
    suggested_fix: Declare valid_from and valid_to explicitly in the config with parse_date format %d/%m/%Y. Note
      that they describe the disciplinary action period, not the entity's registration.
  - id: c-1a2c3a76
    field: entity.acn<-A.C.N
    problem: The regex requires the ACN to be 9 digits in the form 'ddd ddd ddd' or unspaced. Placeholder values
      such as 'N/A' and 'Nil' are dropped as intended, so this works. The unspaced value '643369297' also parses
      correctly.
    severity: advisory
    suggested_fix: No change needed. Optionally document that N/A and Nil values are deliberately skipped.
  - id: c-35cde4c9
    field: entity.status
    problem: Action Type (Automatic Suspension, Suspension, Condition, Reprimand) is left unmapped. Suspension rows
      could support status=suspended, but the end dates and the mix of action types make the meaning ambiguous.
      This is a missed opportunity and not an error.
    severity: advisory
    suggested_fix: Consider mapping Action Type to entity.status with map_values only for clear values such as Suspension
      and Automatic Suspension. Alternatively leave it unmapped as now.
  - id: c-8cffe13b
    field: entity.entity_type
    problem: The source has no entity-type column, so rule 7 allows entity_type_from_suffix on Licensee Name. The
      config does not use it, so company names such as 'PTY LTD' come out as unknown. Person-like names must not
      be inferred as sole_trader, and none are.
    severity: advisory
    suggested_fix: Add entity_type_from_suffix on Licensee Name so company suffixes map to company. Leave names
      without a suffix as unknown.
  - id: c-064cbb39
    field: Related licensees
    problem: Some rows hold related licensee or company names, for example 'GLOBAL ENTERPRISING PTY LTD T/as SA
      Solar4life'. This text carries a legal name and a trading name that are not captured.
    severity: advisory
    suggested_fix: Leave it unmapped, which is acceptable. Note in the unmapped reason that it holds other entities
      and trading names.
