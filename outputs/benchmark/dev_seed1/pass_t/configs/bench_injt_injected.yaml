  - id: c-7449fd03
    field: entity.status<-Licence Status
    problem: Licence Status describes the licence, not the business. 'Current' is mapped to entity status 'active',
      and 'Expired' to 'unknown'. The 'Expired' mapping is conservative and does not state anything unsupported,
      but the licence expiry information is lost.
    severity: advisory
    suggested_fix: Keep the mapping, since it follows rule 8 and avoids guessing. Consider recording licence expiry
      via valid_to only if the source gives an expiry date.
  - id: c-a9a819c3
    field: observed_at
    problem: observed_at uses downloaded_at (2026-11-12), which is when the file was fetched, not when the register
      stated the claims. A resource_last_modified value may be better for a snapshot register.
    severity: advisory
    suggested_fix: Use resource_last_modified if the metadata has it. Otherwise keep downloaded_at.
  - id: c-c56c624d
    field: entity.entity_type
    problem: All names end in 'Pty Ltd' and there is no explicit type column, so entity_type_from_suffix could have
      been used instead of leaving every row as unknown.
    severity: advisory
    suggested_fix: Add entity_type_from_suffix on Business Name.
