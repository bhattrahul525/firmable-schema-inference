  critique_issues:
  - id: c-15be50d4
    field: observation.valid_from
    problem: The envelope applies valid_from (the regulatory Action Date) to every observation, including entity.legal_name
      and entity.acn. The action date is when the licence action took effect, not when the registered legal name
      or ACN became true. For example, 'Galaxy Builders Pty Ltd' gets valid_from 2025-09-26 because of a suspension,
      which the source does not support.
    severity: blocking
    suggested_fix: Set valid_from only on observations that describe the regulatory action. Leave valid_from null
      on entity.legal_name and entity.acn, or source it from a field that actually states when the name or ACN took
      effect.
  - id: c-3c303b63
    field: entity.entity_type
    problem: 'An entity_type ''unknown'' observation is emitted for every row with from: null, so it has no source
      field. The ''Occupation'' and ''Occupation Class'' columns do not state entity type, so this is a default
      rather than a source claim, and it adds an observation the source never made.'
    severity: advisory
    suggested_fix: Either omit the default observation or mark it explicitly as a system default (derivation_level
      L1 with no source) so it is not read as a sourced claim.
  - id: c-405bc19e
    field: entity.legal_name<-Licensee Name
    problem: Individual licensees such as 'AZZI, Daniel' and 'SACCHINELLI, Gregorio' are mapped to legal_name in
      'Surname, Given' form with no normalisation. The config's own reason says individuals are licensees, so the
      field holds a person's name, not a registered company name.
    severity: advisory
    suggested_fix: Keep the raw value, but add a parsing step or note that individual names are not registered legal
      names, and consider a separate handling path for sole traders.
  - id: c-e0a3140b
    field: observation.valid_to
    problem: valid_to is always null, yet several rows carry an Action End Date (for example EDGE PLUMBING ACT PTY
      LTD, end 10/03/2026, and AZZI, Daniel, end 19/11/2025). The config says these are not safely parseable, but
      the values in the examples are plain dd/mm/yyyy dates.
    severity: advisory
    suggested_fix: Parse Action End Date where it is a valid date and map it to valid_to on the action observation,
      keeping N/A as null. Record the parsing as an L1 derivation.
  - id: c-07432797
    field: observation
    problem: The example envelopes show only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible, so the envelope cannot be checked
      against the ontology's required list.
    severity: advisory
    suggested_fix: Show a complete envelope in the examples. Confirm licence is taken from the CKAN metadata, and
      that source_record_id is the documented row hash.
