    field: entity.legal_name<-Business Name
    problem: The reason treats the licensee name on a licence register as the registered legal name. The examples
      carry a 'Pty Ltd' suffix, which supports that reading, but a licence register can hold a trading or operating
      name, and the source does not state that this is the registered name.
    severity: advisory
    suggested_fix: Keep the mapping but note the caveat in the config reason and lower field_confidence, or cross-check
      the name against an ABN register before treating it as the registered legal name.
  - id: c-6eb6716d
    field: entity.entity_type
    problem: 'Every row emits an entity_type observation with value ''unknown'' and from: null. No source column
      supports it, so it is a default and not a claim the source made. It adds noise, and the ontology''s default-to-unknown
      guidance is better served by emitting nothing.'
    severity: advisory
    suggested_fix: Stop emitting default-only entity_type observations when no source column maps to it, or mark
      them clearly as engine defaults rather than source observations.
  - id: c-e42115af
    field: observation envelope
    problem: The shown envelope contains only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version do not appear in the examples. The observed_at
      value is taken from resource_last_modified, which is the time the dataset file changed, not necessarily when
      the claim was stated.
    severity: advisory
    suggested_fix: Confirm that the full envelope is emitted with all required fields, including licence from CKAN
      metadata (or 'unknown' with a flag). Document that observed_at is the resource modification time, and note
      source_record_id construction from Licence No.
