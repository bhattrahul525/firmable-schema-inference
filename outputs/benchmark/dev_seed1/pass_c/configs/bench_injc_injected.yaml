  critique_issues:
  - id: c-b9d1701c
    field: entity.legal_name<-Business Name
    problem: The source is a licence register and the column is 'Business Name'. Nothing in the rows says the name
      is the registered legal name, and the config's own reason concedes that 'registered-name status [is] not explicitly
      stated'. The ontology defines legal_name as 'As registered', so this maps a value to a meaning the source
      does not support.
    severity: blocking
    suggested_fix: Remove the legal_name mapping, or map it to trading_name (or an equivalent licensed-business-name
      field) with the source named. Only map to legal_name if a registered-name source is joined in.
  - id: c-a4e35f45
    field: entity.entity_type
    problem: 'Every example emits entity_type ''unknown'' with from: null, so it is a built-in default and not a
      claim the source made. Emitting it as an observation carries no source_record_id or traceable column and could
      be read as a sourced claim.'
    severity: advisory
    suggested_fix: Stop emitting default-value observations, or mark them as engine defaults that are excluded from
      source claims. Keep entity_type as unknown unless a source states it.
  - id: c-51241e79
    field: observation
    problem: The example envelopes show only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are absent from the examples, and the ontology
      says every record carries the envelope with no exceptions. Licence in particular should be recorded as 'unknown'
      and flagged if it is not clear.
    severity: advisory
    suggested_fix: Confirm the emitted observations carry all required envelope fields, including the licence from
      CKAN metadata (or 'unknown' with a flag), source_record_id built from Licence No, ingested_at, and extractor_version.
  - id: c-b95854d7
    field: observed_at
    problem: observed_at is taken from resource_last_modified. The ontology defines observed_at as when the source
      stated the claim, and a file modification date is a proxy for that. The examples also show every row with
      the same observed_at, which may just be the file timestamp.
    severity: advisory
    suggested_fix: Document that observed_at is the resource last-modified time as a proxy, and keep ingested_at
      separate. Consider valid_from only if the source states when the licence became effective.
  - id: c-e735b787
    field: address.locality<-Suburb
    problem: The suburb and postcode pairs in the examples (Fortitude Valley 4006, Richmond 3121, Sandy Bay 7005,
      Glenelg 5045, Fremantle 6160) look consistent with the state codes. The mapping is sound, but nothing checks
      suburb-postcode agreement.
    severity: advisory
    suggested_fix: Optionally validate suburb against postcode with a reference list and record field_confidence
      accordingly. No change is required for the examples shown.
