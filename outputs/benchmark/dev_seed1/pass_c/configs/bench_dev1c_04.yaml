  critique_issues:
  - id: c-36a4d9dd
    field: entity.legal_name<-Supplier name Parties additionalidentifiers/id not assessed
    problem: The ontology defines legal_name as the name as registered, not the trading name. The config's own reason
      admits the register does not say this column is the registered name. Examples such as '1300 Smiles', 'Stryker'
      and 'Baxter Healthcare' read like trading names, and the mapping still asserts a registered-name meaning the
      source does not state.
    severity: blocking
    suggested_fix: Do not map this column to entity.legal_name. Map it to a supplier-name or trading_name observation
      with a caveat, or leave legal_name unmapped until a registered-name source (ABN Lookup or ASIC) is joined.
  - id: c-3e1ec40c
    field: entity.abn
    problem: The config lists 'Supplier ABN' as an entirely empty column that is unmapped. Row 3 (Rauland Australia)
      has 'Supplier ABN' = '63 056 360 653'. That value passes the ABN checksum (weighted sum 445, divisible by
      89), so the column is not empty and holds a usable identifier that is being discarded.
    severity: advisory
    suggested_fix: Map 'Supplier ABN Parties/identifier/uri not assessed' to entity.abn, strip spaces, validate
      the checksum, record derivation_level L1, and correct the 'entirely empty' note.
  - id: c-07565435
    field: 'unmapped: Finish date Contracts/period/endDate Planned Finish Date'
    problem: The reason says this column is entirely empty, but row 3 has '1/02/2026'. The documentation does not
      match the data and may hide values that matter.
    severity: advisory
    suggested_fix: Correct the reason to say the column is mostly blank, or remove it from the unmapped list with
      a note that it is contract-period data, not entity validity.
  - id: c-32e5169e
    field: address.full<-Supplier address Parties/address not assessed
    problem: The raw address contains parseable parts such as state and postcode ('West End 4101', 'Atherton', 'NSW'),
      but the mapping stores the whole string in address.full only. The ontology's state, postcode and locality
      fields stay empty, and the address is not parsed further.
    severity: advisory
    suggested_fix: Keep address.full as the raw text and add parsed observations for address.state, address.postcode
      and address.locality where present, at derivation_level L1 with field_confidence reflecting parse quality.
  - id: c-0338a922
    field: entity.entity_type
    problem: Each record emits entity.entity_type = 'unknown' with source null. That is the ontology default, but
      it is shown as an observation without a derivation level or confidence values, so it reads like a claim rather
      than a default.
    severity: advisory
    suggested_fix: Either omit default-unknown entity_type observations or mark them explicitly as defaults with
      derivation_level and field_confidence, so they are not confused with source claims.
  - id: c-ace93277
    field: observation envelope (source_id, source_record_id, ingested_at, licence, extractor_version)
    problem: The example envelopes show only observed_at, valid_from and valid_to. The ontology marks source_id,
      source_record_id, ingested_at, licence and extractor_version as required on every record, and none appear
      in the examples. This may be display truncation, but it is unverified.
    severity: advisory
    suggested_fix: Confirm the emitted records carry all required envelope fields. Set licence from CKAN metadata,
      or 'unknown' with a flag. Use the 'Contract reference number' column as source_record_id in preference to
      a row hash, since it is traceable to the exact record.
  - id: c-c7d83009
    field: observation.source_record_id (record_id hash_row)
    problem: source_record_id is a hash of the row, which the ontology requires to be traceable to the exact raw
      record. The source has a stable key ('Contract reference number', for example CHHHS89289-3), which is more
      traceable than a row hash, and the config does not document how the hash is built.
    severity: advisory
    suggested_fix: Use the contract reference number (plus row position if needed) as source_record_id, or document
      the deterministic hash construction and keep the raw row offset alongside it.
  - id: c-12d6716b
    field: entity.legal_name<-Supplier name Parties additionalidentifiers/id not assessed
    problem: The ontology defines legal_name as the name as registered, not the trading name. The config justifies
      mapping this contract-disclosure supplier name to legal_name by saying the ontology accepts 'supplier name'
      as legal_name, but the ontology says no such thing. The examples show names that are plausibly trading names
      rather than registered names, such as '1300 Smiles', 'A1 Cleaners', 'Bunzl Outsourcing', 'Stryker' and 'Baxter
      Healthcare'. The source does not state that these are registered legal names.
    severity: blocking
    suggested_fix: Stop emitting entity.legal_name from this column. Either emit it as a trading_name observation
      (one per record, with the source column cited), or hold it until an ABN or registry lookup confirms the registered
      name. Remove the reason text that claims the ontology accepts supplier name as legal_name.
  - id: c-72fa01a0
    field: entity.entity_type
    problem: 'Every example emits entity_type ''unknown'' with from: null. No source column supports it. The default
      is correct under the ontology, but the observation carries no source trace.'
    severity: advisory
    suggested_fix: Either omit the observation when no source supports it, or document it explicitly as a default
      rather than a source-derived claim, with derivation level and provenance recorded.
  - id: c-28649806
    field: address.full<-Supplier address Parties/address not assessed
    problem: Addresses are passed through as free text. Some contain a state or postcode that could be parsed, for
      example '249 Boundary Street, West End 4101' and '43 Robert Street Atherton', and some lack a state, for example
      'Level 23, Riverside Centre 123 Eagle Street Brisbane'. The address.state and address.postcode fields are
      never populated.
    severity: advisory
    suggested_fix: Add a deterministic parse step that extracts postcode (4-digit) and state where present, recording
      these as L1 derived values with field_confidence reflecting the parse. Leave them null where absent.
  - id: c-ff87e2c3
    field: entity.abn<-Supplier ABN Parties/identifier/uri not assessed
    problem: The ABN column is populated in only one example. The checksum for 63 056 360 653 validates, so that
      example is fine. The header label 'identifier/uri not assessed' suggests the column's provenance has not been
      checked, and the config does not record that caveat.
    severity: advisory
    suggested_fix: Keep the abn transform, which already validates the checksum. Record the 'not assessed' provenance
      caveat in the config notes, and lower field_confidence or note the source limitation for the ABN observation.
