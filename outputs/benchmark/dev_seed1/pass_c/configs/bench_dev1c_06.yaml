validation_summary:
  held_out_rows: 300
  observations_in_held_out: 1079
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-6888fad7
    field: entity.legal_name<-party_name
    problem: The record 'ta7f4232145720493d14bcd1584bf767e' is a 32-character hex-like token, not a business name,
      yet it is emitted as entity.legal_name. The mapping states a registered legal name the source does not support.
    severity: blocking
    suggested_fix: Add a rule that rejects party_name values matching a hash or opaque-token pattern (for example
      32 hex characters with no words) and emits no legal_name observation for them, and record the skip in the
      extractor notes.
  - id: c-f9cf39a3
    field: entity.legal_name<-party_name
    problem: party_name is an IP applicant/owner name, and the config itself says it is not labelled as a registered
      name. The ontology defines legal_name as 'as registered', so the mapping assumes a meaning the source does
      not state. Some values also carry descriptors that a registry would not use, such as 'optio software llc a
      delaware limited liability company' and 'compaq computer corporation incorporated in delaware'.
    severity: advisory
    suggested_fix: Keep the observation but lower field_confidence, or emit it under a name-as-claimed-by-IP-source
      label. Note that jurisdiction descriptors are not stripped, so the value is not a clean registered name.
  - id: c-17e02ab1
    field: entity.entity_type
    problem: 'Every record emits entity.entity_type = unknown with from: null. No source column supports it. It
      is a default rather than a source claim, and it is not in the config. This is consistent with the ontology''s
      default-to-unknown rule, but it is presented as an observation.'
    severity: advisory
    suggested_fix: Either drop default-valued observations from the output or mark them explicitly as engine defaults
      (derivation_level L1 or a null source) so they are not read as a source claim.
  - id: c-f11f6089
    field: observation
    problem: The envelope shown for each record has only observed_at, valid_from and valid_to. The required fields
      source_id, source_record_id, ingested_at, licence and extractor_version are absent from the examples. The
      config also has no licence handling, although the ontology requires it and says to record 'unknown' and flag
      it if no licence is clear.
    severity: advisory
    suggested_fix: Confirm the emitted envelope carries all required fields. Pull licence from the CKAN metadata,
      or record 'unknown' and flag it. Document the record_id construction (lord_party_id plus financial_year) in
      source_record_id.
