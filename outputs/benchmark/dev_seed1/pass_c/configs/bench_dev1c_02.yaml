  critique_issues:
  - id: c-508f5d8b
    field: entity.legal_name<-Name
    problem: The config justifies this mapping only by the suffix (Limited/Ltd) and the grant recipient role. Nothing
      in the source shows these names are the registered legal names rather than trading names. The ontology says
      legal_name is 'as registered', so the claim is not fully supported.
    severity: advisory
    suggested_fix: Cross-check a sample of Name values against the ABN register, or record a field_confidence below
      1 and a note that the name is the applicant name as stated in the grant sheet.
  - id: c-24ddefa6
    field: record_id
    problem: The source_record_id is built from ABN alone. If one company receives several allocations in the 2024-25
      sheet, the key will collide and the records cannot be traced back to their exact raw rows.
    severity: advisory
    suggested_fix: Build source_record_id from the sheet name plus the row number (or ABN plus row index) and document
      the construction, as the ontology requires for keyless sources.
  - id: c-fa155814
    field: observed_at
    problem: observed_at is taken from resource_last_modified, which is the publication or file-modified date, not
      a date the source stated for the allocation. The ontology asks for the time the source stated the claim.
    severity: advisory
    suggested_fix: Keep resource_last_modified but document it as a proxy, or record the financial year (2024-25)
      as valid_from or valid_to where the grant period is known.
  - id: c-f35940e4
    field: observation envelope
    problem: The examples show only observed_at, valid_from and valid_to. The required envelope fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible in the output, and no licence
      has been recorded for this dataset.
    severity: advisory
    suggested_fix: Confirm the emitted observations carry all required envelope fields. Take licence from the CKAN
      metadata, or record 'unknown' and flag it.
  - id: c-668b352d
    field: entity.abn<-ABN
    problem: The config says the ABN is checksum-validated, but the examples do not show which values passed or
      failed. The output does not evidence the checksum step.
    severity: advisory
    suggested_fix: Add a check or log showing the number of ABNs that failed the checksum, and route failures to
      a flagged state rather than emitting them as valid.
