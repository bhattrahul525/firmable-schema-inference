  critique_issues:
  - id: c-bf94ed31
    field: entity.legal_name<-Business Name
    problem: The source is a licence register column called 'Business Name'. Nothing in the source states that it
      is the name as registered with ASIC or the ABR. The reason given ('register names look like registered names')
      is an assumption, and the ontology says legal_name must be the registered name, not a trading name. Several
      example rows also show names that look like trading names, so this claim is not supported by the source.
    severity: blocking
    suggested_fix: Map 'Business Name' to a trading_name observation, or to a separate licensed-name field, with
      a note that it is the name used on the licence. Only map it to legal_name if a registry-sourced name is confirmed
      for this dataset.
  - id: c-a98e97d4
    field: entity.entity_type
    problem: 'Every example emits an entity_type observation of ''unknown'' with from: null. This is a default the
      engine filled in, not something the source said. Several names contain ''Pty Ltd'', which hints at a company,
      but the mapping correctly does not guess.'
    severity: advisory
    suggested_fix: Do not emit an observation for a default value. Leave entity_type absent, or record it as a derived
      default with a clear derivation note, so it is not mistaken for a source claim.
  - id: c-af84a932
    field: observation envelope
    problem: The examples show only observed_at, valid_from and valid_to. The required envelope fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible in these examples. The licence
      should come from the CKAN metadata, or be recorded as 'unknown' and flagged.
    severity: advisory
    suggested_fix: Confirm that every emitted observation carries all required envelope fields, including the licence
      from the dataset metadata (or 'unknown' with a flag) and the extractor_version.
  - id: c-985fd30f
    field: observed_at
    problem: observed_at is set from resource_last_modified, which is when the publisher last changed the file.
      The ontology defines observed_at as when the source stated the claim. These can differ, and the mapping gives
      no note on this.
    severity: advisory
    suggested_fix: Document that observed_at is the resource last-modified time as a proxy, and consider recording
      the licence-status date separately if the dataset provides one.
  - id: c-7a3577d9
    field: status
    problem: Licence Status values such as 'Expired' are left unmapped, which is reasonable because a licence state
      is not an entity status. The mapping still loses a potentially useful claim about the licence.
    severity: advisory
    suggested_fix: Keep the field unmapped as documented, and consider a note or a licence-specific observation
      for future use so the information is not discarded.
  - id: c-111dde10
    field: address.country
    problem: The ontology default is country AU, but no country observation is emitted from the rows. The state
      values are all Australian, so the default could reasonably be applied.
    severity: advisory
    suggested_fix: Either apply the AU default explicitly with a note that it is a default, or leave country out.
      Be explicit about which.
