validation_summary:
  held_out_rows: 300
  observations_in_held_out: 2135
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-c5f9551b
    field: entity.date_registered<-SMSF_REG_DT
    problem: On the Capacity-type row (allen jacob), SMSF_REG_DT equals SMSF_CAPACITY_START_DT (18/04/2013), and
      the config says capacity start is not the entity registration. The config does not explain why the registration
      date is trusted on capacity rows, so the date may describe the capacity appointment rather than the auditor's
      registration.
    severity: advisory
    suggested_fix: Document that SMSF_REG_DT is the auditor registration date on every row kind, or restrict or
      downgrade this mapping for SMSF_ATTRIBUTE_TYPE = Capacity rows.
  - id: c-2741627e
    field: observation envelope
    problem: The envelope shown in every example has only observed_at, valid_from and valid_to. The ontology marks
      source_id, source_record_id, ingested_at, licence and extractor_version as required on every record. The examples
      are either incomplete or the envelope is non-compliant.
    severity: advisory
    suggested_fix: Confirm the emitted records carry all required envelope fields, including the hashed source_record_id,
      licence from the CKAN metadata (or 'unknown' with a flag), and extractor_version.
  - id: c-9917715e
    field: observed_at
    problem: observed_at is identical (2026-11-11T19:32:11.189362) across all rows and appears to be the run time,
      not the resource_last_modified value the config says it comes from. The ontology says observed_at is when
      the source stated the claim, and that differs from ingested_at.
    severity: advisory
    suggested_fix: Set observed_at from the dataset resource_last_modified metadata and record the run time separately
      as ingested_at.
  - id: c-e4f4d8fa
    field: entity.status<-SMSF_STATUS
    problem: map_values covers only 'Registered' and 'Suspended'. Any other or blank value will fall through with
      no defined behaviour. Suspension dates are dropped, so a suspended auditor's current state is not checked
      against those dates.
    severity: advisory
    suggested_fix: Add an explicit fallback to 'unknown' for unmapped values, and consider using the suspension
      dates to set valid_from/valid_to on status observations.
  - id: c-9c6cd755
    field: entity.abn<-SMSF_PERSON_ABN
    problem: The ABN is correctly checksum-valid for the two rows that have one (62359460732 and 17254210398), but
      the auditor is a natural person. A person's ABN usually indicates a sole trader, while entity_type is set
      to 'unknown' on every row. The mapping does not say whether the ABN is an individual's sole-trader ABN.
    severity: advisory
    suggested_fix: Keep entity_type 'unknown' as the default, but note in the config that the ABN belongs to the
      individual auditor and that entity_type is not inferred from it.
  - id: c-89e27fa4
    field: entity.legal_name<-SMSF_NAME
    problem: clean_whitespace leaves inconsistent casing (for example 'allen jacob' and 'FAN YANG' against 'Stephen
      Maher'). This is not a meaning error, but the same person may appear under different name strings across rows.
    severity: advisory
    suggested_fix: Keep the raw value, and add a separate normalised-casing field or note for matching, without
      changing the legal_name value.
  - id: c-f28428cc
    field: source_record_id (record_id hash_row)
    problem: Each auditor appears on several rows (condition and capacity rows), and record_id is a hash of the
      whole row. Any change in condition text or dates produces a new record_id for the same auditor and register
      number, and the SMSF_NUM key is not used.
    severity: advisory
    suggested_fix: Build source_record_id from SMSF_NUM plus row kind, or document the hashing scheme so the record
      can be traced back to the exact raw row.
