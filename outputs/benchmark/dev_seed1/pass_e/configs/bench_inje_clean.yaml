validation_summary:
  held_out_rows: 80
  observations_in_held_out: 560
  unanswered_meaning_warnings: []
  abstentions:
  - field: entity.entity_type
    reason: No explicit entity-type column; entity_type_from_suffix not applied, so the engine records unknown.
  critique_issues:
  - id: c-a8e3e8cd
    field: entity.trading_name<-Business Name
    problem: Every Business Name value ends in 'Pty Ltd', which is the form of a registered company name. The mapping
      follows rule 5 and records it as trading_name at low confidence, which is allowed, but the column may actually
      hold the registered name, so the trading_name claim is weaker than the values suggest. No mapping_confidence
      is stated in the config.
    severity: advisory
    suggested_fix: Keep the trading_name mapping per rule 5 and set mapping_confidence at 0.6 or lower. Note in
      the reason that the 'Pty Ltd' suffix suggests a registered name, so a reviewer can check whether a legal_name
      mapping is justified by the publisher's documentation.
  - id: c-6cddd6c3
    field: entity.entity_type
    problem: The source has no explicit entity-type column, and every sampled name carries a 'Pty Ltd' suffix. Rule
      7 allows entity_type_from_suffix on the name column in this case, but the config does not use it, so the engine
      records 'unknown' for every row.
    severity: advisory
    suggested_fix: Consider adding entity_type_from_suffix on Business Name so that 'Pty Ltd' yields company. If
      the team does not want that inference, record the decision in the config reason.
  - id: c-7d7408b8
    field: entity.status<-Licence Status
    problem: The map_values transform maps 'Expired' to 'unknown'. This is a conservative choice and does not state
      anything the source does not support, but it discards the fact that the licence has expired, which the source
      does state. Only 'Current' and 'Expired' are seen in the profile, so the mapping is complete for the observed
      values.
    severity: advisory
    suggested_fix: Keep 'Expired' as 'unknown' if the team does not accept that an expired licence means deregistration.
      Preserve the raw value 'Expired' in the observation so the licence state is still traceable.
  - id: c-12af4104
    field: unmapped<-Notes
    problem: The Notes column holds free text such as 'address updated', which is a claim about the record's address
      history. It is correctly listed as unmapped, but a reviewer may want to know it exists because it bears on
      address observations.
    severity: advisory
    suggested_fix: Keep the Notes column unmapped, and record in the reason that it carries free-text change notes
      that were not mapped, so later review can pick them up.
