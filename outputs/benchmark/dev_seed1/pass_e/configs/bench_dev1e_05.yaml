  critique_issues:
  - id: c-904e34fb
    field: observation.valid_from
    problem: The envelope sets valid_from from Action Date and valid_to from Action End Date on every observation,
      including entity.legal_name and entity.acn. A regulatory action date says when a suspension, condition or
      disqualification started or ended. It does not say when the registered name or ACN became true, so these dates
      are attached to claims the source does not date that way. The unmapped entries also say Action Date and Action
      End Date are 'used as valid_from/valid_to', but no transform or config key for valid_from or valid_to appears
      in the fields list.
    severity: blocking
    suggested_fix: Do not apply the action dates as valid_from/valid_to on the name and ACN observations. Either
      drop them, or model the action as its own observation with its own validity, and record the date format (dd/mm/yyyy)
      in an explicit parse_date transform with a try_transform check.
  - id: c-841438c2
    field: Action Type
    problem: Action Type values such as 'Suspension' and 'Automatic Suspension' are listed as unmapped on the grounds
      that they are not entity status. The ontology has a 'suspended' status, and these values may describe the
      entity's status more directly than the reason given. Disqualification and Condition are not statuses, so the
      exclusion is reasonable for those.
    severity: advisory
    suggested_fix: Consider whether a licence action of type suspension should be mapped to entity.status via map_values,
      with only the suspension values, and keep Condition and Disqualification unmapped. Record the caveat that
      the suspension applies to the licence, not necessarily to the company.
  - id: c-758598be
    field: Occupation / Occupation Class
    problem: Occupation and Occupation Class are left unmapped with the reason that they are not ANZSIC codes. Rule
      9 allows the source's own code or description to be mapped to industry_code as it is, and these values (e.g.
      Electrician, Builder, Plumber) are descriptive trade categories. The exclusion is defensible, but the reason
      given does not show that these are not the source's own industry description.
    severity: advisory
    suggested_fix: Either keep them unmapped with a clearer reason (trade licence category, not an industry classification),
      or map Occupation to entity.industry_code at a lower mapping_confidence after checking its values against
      the rule.
