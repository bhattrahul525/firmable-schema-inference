config_version: 1
validation_summary:
  held_out_rows: 300
  observations_in_held_out: 997
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-c42ab59b
    field: entity.trading_name<-party_name
    problem: Some party_name values are opaque hash-like tokens (e.g. t17b3a216772440f58ed6d91c061e5b8f, t9495ea68ce67f0f7a325b494e84d084d),
      not business names. Mapping them to entity.trading_name states that these tokens are names the entity traded
      under, which the source does not support.
    severity: blocking
    suggested_fix: Exclude pseudonymised tokens from the trading_name mapping, for example with a pattern filter
      on ^t[0-9a-f]{32}$, or leave those rows without a name observation and record the reason.
  - id: c-69266c90
    field: entity.abn<-lord_party_id
    problem: The config reason says the ABN applies only where lord_party_id_type is 'abn', but the transform does
      not check that flag. It relies on the regex failing for 12- and 13-digit party_id values. This works on the
      sample rows but is fragile.
    severity: advisory
    suggested_fix: Add an explicit condition on lord_party_id_type == 'abn', or confirm that the regex cannot match
      party_id values in the full file.
  - id: c-d711603f
    field: entity.trading_name<-party_name
    problem: party_name is an IP applicant name with no registered-name label, so trading_name at low confidence
      is consistent with rule 5. The mapping does not record a mapping_confidence of 0.6 or lower, and the config
      does not show it.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.6 or lower for this field and note in the reason that the column
      is an unlabelled applicant name.
  - id: c-1587b5a2
    field: entity.entity_type
    problem: Names such as 'tecnol medical products inc a delaware corporation' and 'stanwich industries inc.' carry
      corporate suffixes. The mapping leaves entity_type unmapped, which is allowed under rule 7, so the engine
      records unknown. This is conservative but leaves information unused.
    severity: advisory
    suggested_fix: Leave as is, or consider entity_type_from_suffix on party_name, which rule 7 permits when the
      source has no entity_type column. Flag the choice as a caveat.
