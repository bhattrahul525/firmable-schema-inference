validation_summary:
  held_out_rows: 303
  observations_in_held_out: 2158
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-1dcb24df
    field: entity.legal_name<-SMSF_NAME
    problem: SMSF_NAME is not labelled as a registered, licensee or supplier name. Rule 5 maps a name to legal_name
      only when the data says it is the registered name. The register does list these people as approved auditors,
      so legal_name may be defensible under rule 4, but the mapping rests on an inference from the register's purpose
      rather than a stated label.
    severity: advisory
    suggested_fix: Confirm against the ASIC register field definitions that SMSF_NAME is the registered auditor
      name. If it is not clearly labelled that way, map it to entity.trading_name at confidence 0.6 or lower.
  - id: c-74f934dc
    field: entity.status<-SMSF_STATUS
    problem: The map_values transform covers only 'Registered' and 'Suspended'. The profile may contain other status
      values, which would be left unmapped without comment.
    severity: advisory
    suggested_fix: Check the full distinct-value profile of SMSF_STATUS and add mappings for any other values that
      can be interpreted with confidence, leaving the rest unmapped.
  - id: c-33c1043d
    field: observation.valid_from
    problem: The envelope sets valid_from equal to the SMSF_REG_DT registration date. Rule 10 allows valid_from
      only where the source states when the licence or status started. A registration date is close to that, but
      the envelope treats it as the start of the claim without the source saying so.
    severity: advisory
    suggested_fix: Either justify in the config that the registration date is the start of registration status,
      or leave valid_from null and keep the registration date only in entity.date_registered.
  - id: c-a9cc4e90
    field: record_id
    problem: Rows are one per auditor condition, so the same auditor appears on several rows with identical entity
      observations. hash_row yields distinct IDs per condition row, so the same auditor's claims are duplicated.
      SMSF_NUM is a stable auditor identifier but is not unique per row.
    severity: advisory
    suggested_fix: Document that each row is a condition-level copy of the same auditor claims, or deduplicate observations
      per SMSF_NUM. Consider keeping SMSF_NUM as a traceable source key in the record ID.
  - id: c-b76ee740
    field: unmapped:SMSF_SUSP_START_DT, SMSF_SUSP_END_DT
    problem: Suspension dates are left unmapped to stay conservative. The status is mapped to suspended, but when
      the suspension began and ended is not recorded, so a suspended claim has no time bounds.
    severity: advisory
    suggested_fix: Keep the exclusion if preferred, but note that the suspended status observation has no validity
      window. Alternatively map the suspension dates to valid_from and valid_to on the status observation if the
      source states them.
  - id: c-1aef1a95
    field: unmapped:SMSF_CAPACITY_FIRM_NAME
    problem: The audit firm the auditor belongs to is a real organisation that could be a related entity. It is
      left unmapped with a reason that is accurate but loses a possible entity link.
    severity: advisory
    suggested_fix: Keep it unmapped for now, and consider a relationship or link mapping in a later iteration.
