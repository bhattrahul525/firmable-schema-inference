  - id: c-c3fabe3d
    field: observed_at
    problem: The envelope gives observed_at as 2026-11-10T03:54:44, which is the ingest-time value, not a source
      statement time. The rows' LoadDate values are in July 2015, so the claims are stamped about 11 years after
      the source date. The config's from_metadata resource_last_modified is not being resolved to the source date.
    severity: blocking
    suggested_fix: Resolve resource_last_modified from the CKAN metadata and use that as observed_at. Confirm the
      envelope shows the resource date, not the ingest time, and keep ingested_at separate.
  - id: c-1841983c
    field: entity.trading_name<-SchoolName
    problem: The mapping follows rule 5 for an unlabelled name column, but no mapping_confidence is set. Rule 5
      requires 0.6 or lower for such a column, and the config does not record it.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.6 or lower for SchoolName -> entity.trading_name and say the column
      is not labelled as a registered name.
  - id: c-80019231
    field: entity.trading_name<-SchoolName
    problem: Some school names carry status text, for example 'Rainbow P-12 College (interim name)'. That text is
      part of the observed value and may mislead downstream matching.
    severity: advisory
    suggested_fix: Keep the raw value as observed. Optionally note in the mapping that parenthetical qualifiers
      such as '(interim name)' are present and are not stripped.
  - id: c-df6d4e7a
    field: observation.licence
    problem: The config has no licence for the envelope, although the observation schema requires it. The source
      licence is not recorded in the mapping.
    severity: advisory
    suggested_fix: Read the licence from the CKAN resource metadata. If none is clear, record 'unknown' and flag
      it.
  - id: c-d4a59183
    field: observed_at<-LoadDate
    problem: The parse_date formats are space-separated ('%Y-%m-%d %H:%M:%S.%f' and '%Y-%m-%d %H:%M:%S'), but the
      sample LoadDate values use a 'T' separator (e.g. '2015-07-14T06:30:43.863000'). As written, the transform
      would not parse these values, yet the example envelopes show observed_at as a parsed date. The config and
      the output are inconsistent.
    severity: advisory
    suggested_fix: Check the format with try_transform against the real values. Add a 'T' variant such as '%Y-%m-%dT%H:%M:%S.%f'
      and '%Y-%m-%dT%H:%M:%S', or confirm the xlsx cells are actually stored as space-separated text.
  - id: c-c0cc7102
    field: entity.trading_name<-SchoolName
    problem: The name is mapped to trading_name at the rule-5 fallback, which is correct because the column is not
      labelled as a registered name. Values such as 'Rainbow P-12 College (interim name)' carry a parenthetical
      qualifier that is kept in the observed name, so the claim is not a clean trading name.
    severity: advisory
    suggested_fix: Keep the mapping at 0.6 or lower. Consider noting the qualifier as a caveat, or parsing it into
      a separate observation, rather than changing the field.
  - id: c-a3d9d0cc
    field: entity.entity_type
    problem: The examples show entity_type 'unknown' with no source column. These are all government schools, but
      the source does not state an entity type, so 'unknown' is the correct default. Nothing in the mapping is wrong
      here.
    severity: advisory
    suggested_fix: No change needed. Optionally record in the config notes that the schools are government bodies,
      without mapping entity_type.
