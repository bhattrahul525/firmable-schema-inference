  critique_issues:
  - id: c-cc885911
    field: entity.status<-Licence Status
    problem: The source column is a licence status (Current/Expired), but the map_values transform writes it into
      entity.status as if it described the business entity. Expired is mapped to deregistered, which the source
      does not state. A lapsed licence does not show the company was deregistered, so this claims something the
      source does not support.
    severity: blocking
    suggested_fix: Drop the entity.status mapping, or map the value to a licence-specific field if one exists. If
      entity.status must be used, emit unknown for Expired and only map statuses the register actually states about
      the entity.
  - id: c-904e8774
    field: entity.legal_name<-Business Name
    problem: The column is labelled 'Business Name'. The reason given (name ends in Pty Ltd) is a heuristic, and
      the source does not say the name is the registered name. Trading names on licence registers often look similar,
      so this could be a trading name.
    severity: advisory
    suggested_fix: Consider mapping to trading_name instead, or record the legal_name claim with lower field_confidence
      and a note that the registered status is inferred from the suffix.
  - id: c-2d00bcd5
    field: observation envelope
    problem: The examples show only observed_at, valid_from and valid_to. The required envelope fields source_id,
      ingested_at, licence and extractor_version are not visible, and the config has no licence entry. The source
      licence is not captured.
    severity: advisory
    suggested_fix: Confirm every emitted observation carries source_id, source_record_id, ingested_at, licence (read
      from dataset metadata, or 'unknown' with a flag) and extractor_version.
