  critique_issues:
  - id: c-7974edd3
    field: entity.legal_name<-Supplier name
    problem: The first example row is a column-label row, not a supplier record. Its Supplier name is the placeholder
      'not assessed', and the mapping still emits it as entity.legal_name. The value is a placeholder, not a company
      name the source states.
    severity: blocking
    suggested_fix: Detect and drop label/placeholder rows before mapping (e.g. Supplier name equal to 'not assessed'
      or a header-style row). Emit no legal_name observation for them.
  - id: c-3d409b62
    field: address.full<-Supplier address
    problem: The same label row emits address.full = 'not assessed'. This is a placeholder meaning 'not assessed',
      not a supplier address.
    severity: blocking
    suggested_fix: Treat 'not assessed' and similar sentinel strings as missing values and emit no address observation.
  - id: c-f2b17464
    field: entity.entity_type<-Supplier name
    problem: The label row also yields entity_type 'unknown' from a placeholder name. This is harmless only because
      the default is unknown, but it is still an observation produced from no real claim.
    severity: advisory
    suggested_fix: Suppress the entity_type observation whenever the supplier name is a placeholder, so no observation
      is produced from a non-claim.
  - id: c-c6c3634f
    field: entity.legal_name<-Supplier name
    problem: The ontology defines legal_name as 'as registered, not the trading name'. The source column is a procurement
      'Supplier name' with no registration basis. Names such as 'Blue Care', 'QRMC', 'Benstar', '1300 Smiles' and
      'Bidfood Cairns' may be trading names, so the claim that they are registered legal names is not supported
      by the source.
    severity: advisory
    suggested_fix: Record the value under a source-labelled name or lower the confidence/caveat it, and note that
      it is the name as typed in the procurement disclosure, not the registered legal name, until matched to a register.
  - id: c-7a3bc7a1
    field: entity.abn<-Supplier ABN
    problem: The ABN mapping is configured, but no abn observation appears in any example, including rows where
      the column is blank or 'not assessed'. The config says the field is very sparse, so the absence is expected,
      but it is not shown as an explicit missing-value outcome.
    severity: advisory
    suggested_fix: Confirm that blank and 'not assessed' ABNs produce no observation and are logged as missing,
      and that checksum failures are logged separately.
  - id: c-badc3c07
    field: address.state
    problem: Supplier addresses such as '105 Denham Street, Townsville QLD' and 'Brisbane City QLD' contain a state,
      and '347 Spence Street, Bungalow' contains none. The mapping only fills address.full, so the state and postcode
      that the source does state are not parsed out.
    severity: advisory
    suggested_fix: Add a parse of the state abbreviation into address.state (L1, with field_confidence reflecting
      parse certainty) and leave it null when absent.
  - id: c-d4e0d114
    field: observation.licence
    problem: The example envelopes show observed_at, valid_from and valid_to, but no source_id, source_record_id,
      ingested_at, licence or extractor_version, which are all required by the ontology.
    severity: advisory
    suggested_fix: Show the complete envelope in the examples. Licence should be read from the CKAN metadata or
      recorded as 'unknown' and flagged.
  - id: c-9f409066
    field: entity.legal_name<-Supplier name Parties additionalidentifiers/id not assessed
    problem: The ontology defines legal_name as the registered name, not the trading name. The config's own reason
      says the supplier name is 'not stated as registered name', yet it is mapped to legal_name. The examples show
      trading-style names such as 'Bidfood Cairns', 'Blue Care', '1300 Smiles' and 'Benstar' being emitted as legal
      names, which the source does not support.
    severity: blocking
    suggested_fix: Do not emit legal_name from this column. Emit the supplier name as a low-confidence observation
      under a non-legal field, or hold it until an ABN/ACN lookup confirms the registered name.
  - id: c-0804117b
    field: address.full<-Supplier address Parties/address not assessed
    problem: Several values are not full addresses. 'Brisbane' (Blue Care) and 'Unit 21, 170-182 Mayers Street'
      (Activtec, no suburb or state) are mapped as address.full. Others, such as '5 Commercial Place, Cairns QLD',
      contain a state and locality that are not parsed into address.state, address.locality or address.postcode.
    severity: advisory
    suggested_fix: Keep address.full as the raw string, parse locality and state where present, and lower field_confidence
      or note incompleteness for partial addresses such as 'Brisbane'.
  - id: c-57b6efe2
    field: observation envelope
    problem: The shown envelopes contain only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are absent from the examples, although the ontology
      says every emitted record carries them.
    severity: advisory
    suggested_fix: Confirm the full envelope is emitted, including licence from the CKAN metadata (or 'unknown'
      with a flag) and a deterministic source_record_id from the hashed row.
  - id: c-e87ebcb2
    field: observed_at
    problem: observed_at is taken from resource_last_modified, but the ontology says observed_at is 'when the source
      stated it'. The Activtec row has a contract award date of 1/09/2021, which is after the observed_at of 2021-08-02,
      so the timestamp may not reflect when the claim was made.
    severity: advisory
    suggested_fix: Document that observed_at is a proxy from dataset metadata, and consider keeping the contract
      award date as a separate provenance note rather than relying on it for observed_at.
