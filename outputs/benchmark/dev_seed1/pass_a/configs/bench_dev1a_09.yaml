  abstentions:
  - field: entity.legal_name<-School Name
    reason: Schools are named in a departmental list without any statement that the name is a registered legal name;
      critique flagged this as blocking. Left out.
  critique_issues:
  - id: c-35a1cc89
    field: entity.legal_name<-School Name
    problem: The ontology defines entity.legal_name as the name as registered, but the source is a list of Victorian
      government schools with a name and a department school number. Nothing in the source says these names are
      registered legal names. The config's reason asserts that the school is the entity, which the source does not
      state. Values such as 'Ashwood School' or 'Mansfield Secondary College' are operational names, and the registered
      legal entity behind a government school is more likely the Department or a government body.
    severity: blocking
    suggested_fix: Remove the legal_name mapping. Emit School Name as an observation for a trading_name or as a
      source-stated name with a description that says it is the school name as published, not a registered name.
      Map the entity only if the source supports it. The school's entity_type is unknown until a source states otherwise.
  - id: c-f425a422
    field: observed_at
    problem: observed_at is set from resource_last_modified in the metadata, but the example envelopes show observed_at
      as 2026-11-11T03:38:25, which looks like the ingest run time rather than the metadata date. The ontology says
      observed_at is when the source stated the claim, and ingested_at is when it was read, so these may be conflated.
    severity: advisory
    suggested_fix: Check that observed_at actually takes the resource_last_modified value and that ingested_at holds
      the run time. Record which metadata field was used in the config notes.
  - id: c-efc4d908
    field: observation envelope
    problem: The examples show only observed_at, valid_from and valid_to. The required envelope fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible in the examples, and the licence
      is not shown for this dataset.
    severity: advisory
    suggested_fix: Confirm that every emitted observation carries all required envelope fields. Take the licence
      from the CKAN metadata, or record 'unknown' and flag it.
  - id: c-7e3ebe04
    field: entity.entity_type
    problem: Every example emits entity_type 'unknown' with from null. This is the ontology default and is acceptable,
      but it adds a noise observation to every row with no source claim behind it.
    severity: advisory
    suggested_fix: Either omit the default observation or mark it explicitly as an engine default with derivation_level
      and field_confidence so it cannot be mistaken for a source statement.
