  critique_issues:
  - id: c-08e9e6fe
    field: entity.legal_name<-Business Name
    problem: The ontology defines entity.legal_name as the name 'As registered'. The config's own reason says the
      licence register does not explicitly state registered status. Every example emits Business Name as legal_name
      (e.g. 'Roofing Services 2 Pty Ltd'), so the mapping asserts a registered legal name that the source does not
      support.
    severity: blocking
    suggested_fix: Remove the legal_name mapping for Business Name, or map it to a non-registered field or a lower-confidence
      observation that records it as the licensee name as shown in the register, without claiming it is the registered
      legal name.
  - id: c-8c43d2fb
    field: observation
    problem: The shown envelopes contain only observed_at, valid_from and valid_to. The required observation fields
      source_id, source_record_id, ingested_at, licence and extractor_version are not visible in the examples, so
      the envelope cannot be confirmed as complete.
    severity: advisory
    suggested_fix: Show the full envelope in the examples, including source_id, source_record_id (built from Licence
      No), ingested_at, the licence from CKAN metadata (or 'unknown' with a flag), and extractor_version.
  - id: c-7391e1a7
    field: confidence
    problem: No confidence values (source_reliability, field_confidence) appear in the example observations, so
      it is unclear whether the ABN checksum validation and the postcode/state parsing were scored.
    severity: advisory
    suggested_fix: Emit field_confidence per mapped field, reflecting whether the abn checksum passed, and source_reliability
      for the licence register, kept separate.
