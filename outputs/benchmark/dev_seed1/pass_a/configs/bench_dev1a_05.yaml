  critique_issues:
  - id: c-6042af6a
    field: observation envelope
    problem: The example envelopes show only observed_at, valid_from and valid_to. The ontology marks source_id,
      source_record_id, ingested_at, licence and extractor_version as required on every record, and none appear
      in the examples.
    severity: advisory
    suggested_fix: 'Confirm the emitted records carry all required envelope fields, and show them in the examples:
      source_id, source_record_id (from the hash_row key), ingested_at, licence (from CKAN metadata, or ''unknown''
      with a flag) and extractor_version.'
  - id: c-e53fcaef
    field: observed_at
    problem: The config takes observed_at from resource_last_modified, but every example shows the same timestamp,
      2026-09-30T16:25:43.332780, which looks like the run time rather than the metadata date.
    severity: advisory
    suggested_fix: Check that observed_at is populated from resource_last_modified and that ingested_at is recorded
      separately as the read time.
  - id: c-e07bc709
    field: entity.entity_type<-Licensee Name
    problem: Company types are inferred from the 'Pty Ltd' suffix, which is a deterministic L1 derivation, but the
      examples do not record a derivation_level. 'Jason Harwood' and 'Morris Construction Corporation' correctly
      come out as unknown.
    severity: advisory
    suggested_fix: Record derivation_level L1 for suffix-derived entity_type values and keep unknown as the default
      for names without a recognised suffix.
  - id: c-bd6fdeb1
    field: valid_from<-Action Date
    problem: Action Date is the date a regulatory action was taken, not the date a status became true in the world.
      It is used as valid_from for the suspension and rectification observations, so these observations are timed
      by the regulator's action rather than by any stated status change.
    severity: advisory
    suggested_fix: Keep Action Date as valid_from only if you treat it as the date the regulatory claim took effect,
      and say so in the mapping notes. Otherwise leave valid_from empty for these records.
  - id: c-aa389ebf
    field: entity.status
    problem: Action Type 'Automatic Suspension' is not mapped to entity.status, so these suspension records give
      no status observation even though the source states a suspension. The licence suspension is a licence action,
      not necessarily an entity status, so leaving status unmapped is defensible.
    severity: advisory
    suggested_fix: Keep status unmapped unless the source defines a link to the entity status, and note in the mapping
      that licence suspensions are kept as an unmapped regulatory action rather than entity status.
