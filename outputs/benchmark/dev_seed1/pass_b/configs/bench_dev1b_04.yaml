validation_summary:
  held_out_rows: 25
  observations_in_held_out: 48
  unanswered_meaning_warnings: []
  abstentions:
  - field: entity.legal_name<-Supplier name
    reason: Supplier name is a counterparty name in a procurement disclosure, not stated as registered name; critique
      flagged it as blocking. Left out rather than guessed. Could be mapped to trading_name in a later run with
      a new critique.
  critique_issues:
  - id: c-e37920c7
    field: entity.legal_name<-Supplier name
    problem: The first example row is a schema or metadata row (Description 'OCDS name', with column values such
      as 'Parties additionalidentifiers/id' and 'Parties/identifier/uri') that survived the reader. The engine turned
      its 'Supplier name' value into an entity.legal_name observation, so the output asserts that a company is legally
      named 'Parties additionalidentifiers/id'. The source does not support that.
    severity: blocking
    suggested_fix: Drop this row before mapping. Raise skip_rows or add a rule that discards rows whose Description
      is a schema label, and emit no entity observations from it.
  - id: c-9e3e6073
    field: address.full<-Supplier address
    problem: The same schema row yields an address.full observation with the value 'Parties/address'. That is a
      field path, not an address.
    severity: blocking
    suggested_fix: Filter out the schema row as above so that no address observation is produced from it.
  - id: c-55eaa2cb
    field: entity.legal_name<-Supplier name
    problem: The source column is a contracting party name ('Supplier name'), and the mapping labels it legal_name
      'as registered' on the basis of rule 4. Names such as 'Deloitte', 'Ozcare', 'Compumedics' and 'Baxter Healthcare'
      may be trading names, and nothing in the source says they are registered names.
    severity: advisory
    suggested_fix: Keep the observation but record the source as a contract counterparty name, or emit it as trading_name
      with lower field_confidence unless it is matched to a registry record that confirms the registered name.
  - id: c-4b8d9f00
    field: entity.abn<-Supplier ABN
    problem: No real data row carries a Supplier ABN value; the only appearance is in the schema row, and drop_empty_columns
      may remove the column entirely. The ABN mapping therefore produces nothing and is untested against real values.
    severity: advisory
    suggested_fix: Confirm the column exists and is populated in the actual data. If it is always empty, document
      that the field is unavailable for this source rather than leaving an unexercised mapping in place.
  - id: c-78531f6f
    field: entity.entity_type
    problem: Every record emits an entity_type observation of 'unknown' with a null source column. This is a default,
      not a claim from the source, and it adds an observation to every row.
    severity: advisory
    suggested_fix: Do not emit default values as observations. Set entity_type only when a source states it.
  - id: c-3f33d328
    field: address.full<-Supplier address
    problem: Some supplier addresses contain a state (for example 'Old Toongabbie, NSW', 'Abbotsford VIC', 'Perth
      WA') but the mapping stores only the raw string and does not parse state or postcode. The agency address state
      QLD must not be used for the supplier.
    severity: advisory
    suggested_fix: Parse state into address.state, using an L1 derivation, and keep the raw string in address.full.
      Leave state empty when the address does not state one.
  - id: c-92905466
    field: observation
    problem: The example envelopes show only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are absent from the output shown, and licence
      is not stated for this dataset.
    severity: advisory
    suggested_fix: Show or emit the full required envelope on every observation. Record licence as 'unknown' and
      flag it if the CKAN metadata does not state one.
  - id: c-4afe96c4
    field: entity.legal_name<-Supplier name
    problem: The source column is the supplier name as written in a procurement disclosure. Several examples are
      brand or trading-style names, not registered legal names (for example 'Deloitte', 'Ozcare', 'Compumedics',
      'Ernst and Young', 'Baxter Healthcare'). Mapping them to entity.legal_name states a registered name the source
      does not support.
    severity: blocking
    suggested_fix: Map Supplier name to entity.trading_name (or an observation of the name as stated in the disclosure)
      rather than legal_name. Only populate legal_name from a source that states the registered name, such as an
      ABN or ACN register lookup.
  - id: c-df72114e
    field: entity.entity_type
    problem: 'Every emitted record includes an entity.entity_type observation with value ''unknown'' and from: null.
      No source column produces it. It is a default written as if it were a source claim.'
    severity: advisory
    suggested_fix: Do not emit default values as observations. Omit entity_type when no source states it, or record
      it explicitly as a defaulted value with a derivation note.
  - id: c-85087a19
    field: observation envelope
    problem: The shown envelopes contain only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible in the examples, and the config
      does not show where licence or source_id come from.
    severity: advisory
    suggested_fix: Confirm that every emitted observation carries all required envelope fields, including licence
      (or 'unknown' with a flag) and extractor_version, and show them in the examples.
  - id: c-78558e8c
    field: entity.legal_name<-Supplier name regex
    problem: The regex excludes any supplier name beginning with 'Parties' or 'not assessed'. This is a prefix match,
      so a real supplier whose name begins with 'Parties' would be dropped, and the match is case-sensitive, so
      'Not assessed' would pass through.
    severity: advisory
    suggested_fix: Match the exact placeholder and label rows (for example anchored full-line matches) and make
      the placeholder check case-insensitive, rather than excluding by name prefix.
