  unanswered_meaning_warnings: []
  abstentions:
  - field: entity.entity_type
    reason: No explicit source column; rows are individual auditors, so the engine records unknown. Not mapped.
  - field: valid_from/valid_to
    reason: SMSF_REG_DT is registration date, not a stated licence start for the claim; left out conservatively.
  critique_issues:
  - id: c-89a31c6f
    field: observation envelope
    problem: Every example envelope shows only observed_at, valid_from and valid_to. The required envelope fields
      source_id, source_record_id, ingested_at, licence and extractor_version are absent from the emitted observations,
      although the ontology says every record carries them.
    severity: advisory
    suggested_fix: Confirm these fields are added downstream of the examples, or emit them in the observations.
      Set licence to the CKAN metadata value or 'unknown' with a flag, and check that observed_at comes from resource_last_modified
      as configured.
  - id: c-775e193b
    field: entity.entity_type
    problem: 'Each example emits entity_type ''unknown'' with from: null. No source field supports it, so this is
      a default written as an observation rather than a claim the source made. The rows are individual auditors,
      so the source does not say whether the registered entity is a person, a sole trader or something else.'
    severity: advisory
    suggested_fix: Do not emit a sourceless entity_type observation. If a default is needed, keep it out of the
      observation stream or mark it as a default with derivation_level L1 and no source value.
  - id: c-50698996
    field: entity.status<-SMSF_STATUS
    problem: The source value 'Registered' is mapped to 'active'. The register says the auditor is registered, which
      is close to active but is not the same claim. The mapping also has no entry for deregistered or other values
      the register may hold.
    severity: advisory
    suggested_fix: Keep the mapping but note the interpretation, or record the raw value alongside it. Add explicit
      handling for other status values, or route unmapped values to 'unknown' and flag them.
  - id: c-a6e384ca
    field: entity.legal_name<-SMSF_NAME
    problem: The source is an individual auditor's personal name, not a registered company or entity name. Storing
      it as legal_name is defensible, but the ontology's legal_name note assumes a registered entity, and the mapping
      does not record that the subject is a person.
    severity: advisory
    suggested_fix: Keep the mapping, and add a note in the config that SMSF_NAME is the auditor's personal name.
      Consider whether the entity type should be recorded as a person-type claim rather than left unknown.
