  critique_issues:
  - id: c-4fb0726f
    field: entity.status<-Licence Status
    problem: 'The source column is a licence status (Current/Expired), but it is mapped to entity.status, which
      is company status. The config''s own reason admits the mapping is an approximation. The examples show LIC00126
      (Expired) emitted as entity.status ''deregistered'', which the source does not support: a lapsed licence does
      not show that the company was deregistered or is inactive.'
    severity: blocking
    suggested_fix: Remove the mapping to entity.status. Either drop the column or carry it under a licence-specific
      field that the ontology does not yet define, and leave entity.status as unknown unless another source states
      the company status.
  - id: c-9886a773
    field: entity.legal_name<-Business Name
    problem: The source is a licence holder business name. The config assumes it is the registered legal name, but
      the source does not say so and it could be a trading name.
    severity: advisory
    suggested_fix: Record a caveat in the field_confidence or notes, or cross-check against a registry source before
      treating it as the registered legal name.
  - id: c-6eb7b096
    field: entity.entity_type
    problem: 'Every example emits an entity.entity_type observation of ''unknown'' with from: null. No source column
      produced it, so these are synthetic observations rather than claims the source made.'
    severity: advisory
    suggested_fix: Do not emit an observation for fields with no source value. If a default is wanted, apply it
      at read time and not as a sourced observation.
  - id: c-3f56aa61
    field: observation envelope
    problem: The envelope in the examples only shows observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible, and the observed_at value is
      set from resource_last_modified, which is a dataset-level timestamp and not necessarily when the claim was
      stated.
    severity: advisory
    suggested_fix: Confirm that every emitted record carries all required envelope fields, including licence (from
      CKAN metadata, or 'unknown' with a flag) and extractor_version. Document the observed_at proxy as a caveat.
  - id: c-5870dd5e
    field: address.country
    problem: address.country is not emitted in the examples, although the ontology gives it a default of AU and
      the data is clearly Australian.
    severity: advisory
    suggested_fix: Emit address.country as AU for these rows, or confirm the default is applied downstream.
