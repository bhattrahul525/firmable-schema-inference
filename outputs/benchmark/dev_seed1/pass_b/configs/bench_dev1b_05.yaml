  critique_issues:
  - id: c-00030084
    field: entity.legal_name<-Licensee Name
    problem: Licensee Name is used as legal_name for rows that are individuals, not companies (e.g. 'ASSI, Mohamad
      Baker' and 'Jason Harwood'). The ontology says legal_name is the registered name, and a person's licence name
      is not a registered entity name. The 'ASSI, Mohamad Baker' row also keeps the surname-first order from the
      source.
    severity: advisory
    suggested_fix: Keep the mapping, since the name is what the licensee is called, but document that the column
      mixes companies and individuals. Consider a note or a separate observation flag for individual licensees,
      and do not let the name imply an entity type.
  - id: c-8e234c5d
    field: entity.entity_type
    problem: 'Every example is emitted as ''unknown'', which is the conservative default. Some rows do support a
      more specific value at L1 from the source text: ''PTY LTD'' or ''PTY LIMITED'' in the name, and ''The company
      was automatically suspended'' in Circumstances/Reasons (e.g. DETLEV''S ELECTRICAL, Fortun8, Five Rivers).
      Individual names are consistent with sole_trader but do not establish it.'
    severity: advisory
    suggested_fix: Optionally derive entity_type=company at derivation_level L1 from the Pty Ltd/Limited suffix
      and the 'company was suspended' wording. Leave individuals as unknown. Being richer here is optional; the
      current output is not wrong.
  - id: c-45e45277
    field: observed_at
    problem: The config sets observed_at from resource_last_modified, but the envelope shows the same ingest-like
      timestamp (2026-09-30T16:25:43.332780) on every record. That looks like the time of reading, not the time
      the source stated it.
    severity: advisory
    suggested_fix: Confirm that resource_last_modified is actually being read, and check that the envelope value
      is not the ingested_at value copied into observed_at.
  - id: c-cc225bbc
    field: observation envelope
    problem: The examples show only observed_at, valid_from and valid_to. The required envelope fields source_id,
      source_record_id, ingested_at, licence and extractor_version are not visible. record_id uses hash_row, which
      is deterministic but depends on row position and is not documented.
    severity: advisory
    suggested_fix: Show the full envelope in the examples. Document how source_record_id is built from the row hash,
      and confirm that the licence comes from the CKAN metadata or is recorded as 'unknown' and flagged.
