  critique_issues:
  - id: c-b45b4e2c
    field: entity.legal_name<-Business Name
    problem: The reason asserts that the 'Business Name' column is the registered licensee name. The source is a
      licence register, and a business name there may be a trading name rather than the registered legal name. The
      examples' 'Pty Ltd' suffixes support the mapping, but the source does not state that this column is the registered
      name.
    severity: advisory
    suggested_fix: Keep the mapping, but soften the reason to say the value appears to be the licensee name, and
      consider a trading_name observation or a field_confidence below 1 until the register's definition is confirmed.
  - id: c-eb4c295f
    field: entity.entity_type
    problem: 'Every record emits an entity_type observation of ''unknown'' with from: null. No source column supports
      it, so it is a default rather than a source claim, yet it is written as an observation.'
    severity: advisory
    suggested_fix: Either omit the default observation or mark it explicitly as a config default (derivation_level
      L1 or a non-source marker) so it is not read as something the source stated.
  - id: c-a7d9091b
    field: observation
    problem: The shown envelopes include only observed_at, valid_from and valid_to. The required fields source_id,
      source_record_id, ingested_at, licence and extractor_version do not appear in the examples. Licence and provenance
      are also not shown in the config.
    severity: advisory
    suggested_fix: Confirm the emitted envelope carries all required observation fields, including licence from
      the CKAN metadata (or 'unknown' flagged) and extractor_version.
  - id: c-6f3ee24d
    field: observed_at
    problem: observed_at is taken from the dataset metadata field resource_last_modified. That is when the publisher
      last touched the resource, not necessarily when the individual licence claim was stated.
    severity: advisory
    suggested_fix: Document this as a proxy for observed_at, or check whether per-record dates exist in the source.
  - id: c-a00865cb
    field: address.locality<-Suburb
    problem: Locality is copied from the Suburb column without parsing or normalisation. This is acceptable, but
      the envelope and transform list give no check that suburb values are consistent with state and postcode.
    severity: advisory
    suggested_fix: Optionally cross-check suburb, state and postcode, and record the result in field_confidence.
