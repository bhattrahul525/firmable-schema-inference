  critique_issues:
  - id: c-0de82caa
    field: entity.date_registered<-SMSF_REG_DT
    problem: The envelope valid_from appears to be filled with the registration date, which is a reasonable reading
      but is not stated as such by the source. The date is registration as an approved SMSF auditor, not registration
      of a business entity.
    severity: advisory
    suggested_fix: Keep it, but note in the reason that this is the date of registration as an SMSF auditor, not
      the date the business entity was registered.
  - id: c-452af7d1
    field: entity.legal_name<-SMSF_NAME
    problem: The reason says 'registered auditor name', but the values are individual people's names (e.g. RIMAL
      PRASAD, Katie Timms). The source gives no support for calling these a registered legal name of a business
      entity, and the ABN column is a personal ABN. The entity_type is correctly left unknown, so the impact is
      limited.
    severity: advisory
    suggested_fix: Reword the reason to say it is an individual auditor's name as listed on the register. Keep entity_type
      unknown, since the source does not say whether the person is a sole trader.
  - id: c-9c632af8
    field: entity.status<-SMSF_STATUS
    problem: The map_values only covers Registered and Suspended. Other statuses in the full data, such as ceased
      or disqualified, would be unmapped. The 'active' value comes from 'Registered' on an auditor register, which
      says the person is a registered auditor, not that a business is trading.
    severity: advisory
    suggested_fix: Confirm the full set of status values in the data and map them explicitly or leave them unknown.
      Document that 'active' means currently registered as an SMSF auditor.
  - id: c-75adeec2
    field: entity.legal_name<-SMSF_NAME
    problem: The raw data contains multiple rows per auditor (SMSF_ATTRIBUTE_TYPE is Condition or Capacity). The
      same person can be emitted several times with identical claims. The row-hash record_id also differs per attribute
      row, which does not identify the auditor.
    severity: advisory
    suggested_fix: Consider using SMSF_NUM in the record key, or dedupe the observations per auditor. Document the
      multi-row structure.
