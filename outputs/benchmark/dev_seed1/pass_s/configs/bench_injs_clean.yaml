  - id: c-dee5e701
    field: entity.status<-Licence Status
    problem: A 'Current' licence is mapped to entity status 'active'. The licence status describes the licence,
      not the entity's registration, so this is a mild semantic stretch. The Expired->unknown mapping is cautious,
      but Expired does not appear in the examples.
    severity: advisory
    suggested_fix: Lower field_confidence for the Current->active mapping, or note that status is derived from licence
      status and not from the ABN register.
  - id: c-cef393a2
    field: entity.legal_name<-Business Name
    problem: The column is labelled 'Business Name' for a licensee. It could be a trading name, though all examples
      carry Pty Ltd suffixes consistent with registered names.
    severity: advisory
    suggested_fix: Keep the mapping but lower field_confidence slightly, and consider cross-checking against ABR.
  - id: c-7988dd60
    field: observed_at
    problem: observed_at comes from resource_last_modified, which is the file modification time and not necessarily
      when the licensing body stated the claim. The examples show a future-looking date (2026-11-12).
    severity: advisory
    suggested_fix: Document that observed_at is a proxy and verify the metadata timestamp.
