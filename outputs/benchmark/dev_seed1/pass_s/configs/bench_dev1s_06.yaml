validation_summary:
  held_out_rows: 300
  observations_in_held_out: 1218
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-b9787d1b
    field: entity.legal_name<-party_name
    problem: Some party_name values are anonymised hash tokens (e.g. 'tee389f85ef3c708c9ec5f1d9a8fefea2', 't6b0a08d7d80f8d5d88e8ef18eaafca56',
      'td530a0a7c69ab8c38e323c66d88abbd7'), not registered names. Mapping them to legal_name states a name the source
      does not give.
    severity: blocking
    suggested_fix: Drop legal_name when party_name matches a hash-like pattern, such as ^t[0-9a-f]{32,33}$, or flag
      it as redacted.
  - id: c-7e1d54a5
    field: entity.legal_name<-party_name
    problem: Names are lowercased in the source. The mapping keeps this casing, and the dataset is IP Australia's
      party-level data, not a registry, so the name is as the IP source records it.
    severity: advisory
    suggested_fix: Treat the value as a source-stated name and optionally normalise the case downstream.
  - id: c-a8851684
    field: entity.entity_type
    problem: entity_type is always 'unknown' even though names include 'pty ltd', 'inc' and 'ag'. This is safe but
      loses information.
    severity: advisory
    suggested_fix: Optionally derive entity_type from name suffixes at a lower derivation level, or leave as unknown.
  - id: c-1e6c5fc3
    field: address.country<-country_code
    problem: Non-AU country codes (US, DE) are emitted. This is correct, but the address state and postcode are
      absent for these rows, and no address.full or locality exists.
    severity: advisory
    suggested_fix: None required; consider validating country codes against ISO 3166.
  - id: c-46398209
    field: entity.legal_name<-party_name
    problem: 'The anonymisation-token regex only matches ''t'' followed by exactly 32 hex characters. Two of the
      raw rows have tokens that do not fit this pattern: ''tee389f85ef3c708c9ec5f1d9a8fefea2'' and ''t6b0a08d7d80f8d5d88e8ef18eaafca56''
      (33 characters after the ''t'' in the second). Both were correctly dropped, but only because the pattern happens
      to match. The third token, ''td530a0a7c69ab8c38e323c66d88abbd7'', was also dropped. The pattern''s fit is
      fragile, so future hash tokens of a different length could leak through as legal names.'
    severity: advisory
    suggested_fix: Loosen the exclusion to something like ^t[0-9a-f]{30,40}$ so hash tokens are reliably excluded.
  - id: c-34efad70
    field: entity.abn<-lord_party_id
    problem: ABN is only extracted when lord_party_id_type is 'abn', but the config does not condition on that column;
      it relies on the 11-digit regex plus the checksum. Rows with type party_id and an 11-digit id could be wrongly
      treated as an ABN. In the examples, party_id values are 12-13 digits, so this did not occur, but 908.0 style
      ids are not protected by the type flag.
    severity: advisory
    suggested_fix: Gate the extraction on lord_party_id_type == 'abn', or rely on the checksum and document that.
  - id: c-2477b79f
    field: entity.entity_type
    problem: entity_type is always 'unknown', even where the name clearly indicates a type (e.g. 'pty ltd' suggests
      a company, 'inc' an incorporated association or US corporation). This is safe but not rich.
    severity: advisory
    suggested_fix: Optionally derive entity_type from the legal-name suffix at a lower derivation level, or leave
      as unknown.
