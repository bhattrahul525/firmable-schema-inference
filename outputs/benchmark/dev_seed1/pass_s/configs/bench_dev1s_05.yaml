  critique_issues:
  - id: c-81238d0f
    field: entity.legal_name<-Licensee Name
    problem: For individual licensees the Licensee Name is a person's name (e.g. 'JOHNSTONE, James', 'DARREN JOHN
      EDGE'), not a registered legal entity name. Mapping it to legal_name states a registration the source does
      not support.
    severity: blocking
    suggested_fix: Only emit legal_name for rows with an ACN or a company suffix (Pty Ltd). For individuals, skip
      or map to a person-name field; keep entity_type unknown or sole_trader only if stated.
  - id: c-b28f510b
    field: entity.legal_name<-Licensee Name
    problem: Trailing punctuation is left in the name ('DYNAMIC PROJECTS (AUS) PTY LTD,'). Clean_whitespace does
      not strip it.
    severity: advisory
    suggested_fix: Add a transform to strip trailing commas and punctuation.
  - id: c-22d5eb2c
    field: valid_from
    problem: The envelope valid_from is taken from Action Date, which is when a suspension/condition began, not
      when the name or ACN claim became true. Also valid_to stays null even where Action End Date is given (e.g.
      02/02/2026, 18/06/2026, 04/12/2018), so the suspension is shown as still current. The config does not document
      this.
    severity: advisory
    suggested_fix: Document that valid_from is the action date, and populate valid_to from Action End Date when
      it is not N/A, or avoid presenting it as validity of the entity claims.
  - id: c-36f27361
    field: status
    problem: The dataset is a register of suspensions and conditions, but no status observation is emitted. Suspended
      licensee information is dropped, and Action Type is unmapped.
    severity: advisory
    suggested_fix: Consider mapping Action Type 'Automatic Suspension' to status=suspended (licence-level, so with
      caution), or flag it in a note.
  - id: c-d235d589
    field: observed_at
    problem: observed_at (2026-09-30) comes from the resource's last-modified metadata, and it is later than many
      action dates. This is a file-level timestamp and not necessarily when each record was stated.
    severity: advisory
    suggested_fix: Document that observed_at is the file modification time.
