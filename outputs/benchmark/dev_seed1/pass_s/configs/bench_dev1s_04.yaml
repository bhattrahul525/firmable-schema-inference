  - id: c-a2ca238c
    field: entity.legal_name<-Supplier name
    problem: In the first example row, the 'Supplier name' cell holds the OCDS field-path label 'Parties additionalidentifiers/id',
      not a supplier name. The mapping emits it as legal_name. This is a schema-description row, not a data row,
      and the skip_rows setting did not remove it.
    severity: blocking
    suggested_fix: Increase skip_rows or add a filter to drop the OCDS mapping row so its header-like text is never
      emitted as a legal_name.
  - id: c-d1cb9232
    field: address.full<-Supplier address
    problem: The first example emits 'Parties/address' as an address, which is an OCDS field path, not an address.
      In the MIMS row, the 'Supplier address' column holds 'MIMS Australia', which is a company name, not an address.
      The mapping emits it as address.full, so a value is placed in a field it does not mean, and the supplier name
      is missing.
    severity: blocking
    suggested_fix: Drop the OCDS description row. Add validation so address.full is only emitted when the value
      looks like an address (street, locality, state or postcode). Route name-like values to a review queue or treat
      them as a possible legal_name candidate.
  - id: c-fe4bbf2e
    field: entity.abn<-Supplier ABN
    problem: No example row carries a Supplier ABN value, so the ABN mapping is untested. The only value seen is
      the OCDS label 'Parties/identifier/uri', which the regex rightly rejects.
    severity: advisory
    suggested_fix: Verify the ABN mapping on real rows with an ABN present before relying on it.
  - id: c-05c07f2b
    field: envelope.valid_from
    problem: Only the Blue Care row has valid_from (2020-08-08), taken from 'Commence date'. This column is not
      listed in the config, so the source of valid_from is undocumented. 'Commence date' is a contract start date,
      not the date the entity's claim became true. The config's 'unmapped' list also omits 'Commence date' and 'Finish
      date'.
    severity: advisory
    suggested_fix: Document the valid_from source in the config, or drop it. List Commence date and Finish date
      in 'unmapped' as contract attributes.
  - id: c-5250d5fb
    field: observed_at
    problem: observed_at is the resource last-modified time (2021-08-02). One row has an award date of 13/08/2021,
      which is after that timestamp, so the claimed observation time is inconsistent with the data.
    severity: advisory
    suggested_fix: Check the metadata timestamp, or flag rows whose dates postdate observed_at.
  - id: c-80ac725d
    field: entity.legal_name<-Supplier name Parties additionalidentifiers/id
    problem: The first example row is a template or placeholder row (the other columns hold header text such as
      'Contract Name' and 'Executed Contract Value'). Its supplier name 'not assessed' was emitted as a legal_name
      observation, but it is not a name.
    severity: blocking
    suggested_fix: Add a null-token filter that drops 'not assessed', 'N/A' and similar placeholders for this field.
      Skip rows whose other columns repeat header text.
  - id: c-0d5f7514
    field: address.full<-Supplier address Parties/address
    problem: The value 'not assessed' was emitted as a supplier address. The source states no address, so this puts
      a non-address value in the field.
    severity: blocking
    suggested_fix: Treat 'not assessed' and 'N/A' as null for this field and emit no observation.
  - id: c-b332f7f8
    field: entity.legal_name<-Supplier name Parties additionalidentifiers/id
    problem: Several supplier names look like trading or short names rather than registered legal names, for example
      'Stryker', 'Blue Care', 'Bunzl Outsourcing' and 'Corrs Chambers Westgarth'. The source does not say they are
      legal names.
    severity: advisory
    suggested_fix: Lower field_confidence for names without a suffix such as Pty Ltd. Resolve them against the ABR
      later.
  - id: c-90b5d1f6
    field: entity.abn<-Supplier ABN Parties/identifier/uri
    problem: The ABN mapping produced no observations in any example. The column is either absent or holds 'not
      assessed', so the mapping gives no supplier identifier. This limits entity resolution to name matching.
    severity: advisory
    suggested_fix: Confirm whether the ABN column is populated in other rows. If it is not, flag the lack of identifiers.
  - id: c-b37f0b65
    field: address.full<-Supplier address Parties/address
    problem: Some addresses are only a locality or city, for example 'Brisbane' and 'Perth, WA'. They are stored
      as full addresses, and state and locality are not parsed out.
    severity: advisory
    suggested_fix: Parse locality, state and postcode where present. Lower field_confidence for partial addresses.
  - id: c-5171e0f6
    field: envelope.valid_from
    problem: valid_from is filled from the contract commence date in some rows and left null in others. The commence
      date is not in the config's mapped or unmapped lists, so the source of valid_from is undocumented. A contract
      start date also does not show when the supplier's name or address became true.
    severity: advisory
    suggested_fix: Document where valid_from comes from, or leave it null. A contract start date is not an entity-level
      validity date.
