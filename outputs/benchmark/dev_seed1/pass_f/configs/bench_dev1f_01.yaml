  critique_issues:
  - id: c-316945eb
    field: entity.legal_name<-SMSF_NAME
    problem: The register lists individual approved SMSF auditors. Most rows have a blank SMSF_PERSON_ABN, and the
      example rows without an ABN (e.g. Bradley Donnelly, Richard Wytkin) are mapped as entity.legal_name with entity_type
      unknown. Rule 18 says a person-like name is an entity only when it has its own valid ABN. Rows with no business
      identifier belong in no_business_entities, so the source does not support treating them as business entities.
    severity: blocking
    suggested_fix: Gate the entity claims on a valid SMSF_PERSON_ABN, or route rows with no ABN to no_business_entities.
      Keep the address and status claims only where the row is a valid entity, and document the rule.
  - id: c-f08aae01
    field: record_id
    problem: Each row is one condition attached to an auditor, so one auditor can appear on several rows. SMSF_NUM
      is therefore not unique per row, and hash_row=true is the correct choice. The unmapped reason for SMSF_NUM
      should say it is not a unique row key, so the choice is not read as a judgement about the number itself.
    severity: advisory
    suggested_fix: Keep hash_row=true. Reword the SMSF_NUM unmapped reason to say the auditor number is not unique
      per row and is not a business identifier.
  - id: c-a3487337
    field: entity.status<-SMSF_STATUS
    problem: The map covers only 'Registered' and 'Suspended'. The profile for the full dataset is not shown, so
      other status values may exist and be silently dropped. Each condition row also carries its own status, so
      the status claim may describe the auditor rather than the condition.
    severity: advisory
    suggested_fix: Confirm the full set of SMSF_STATUS values in the profile and map any others explicitly or leave
      them unmapped. Confirm the status describes the auditor's registration, not the condition.
  - id: c-6713e68a
    field: entity.legal_name<-SMSF_NAME
    problem: The legal_name mapping relies on the register-holder rule (5b). The column label SMSF_NAME does not
      itself say registered or licensee name, so the mapping_confidence for this claim should be 0.7 or lower unless
      the register label is read as the holder.
    severity: advisory
    suggested_fix: Set mapping_confidence at or below 0.7 for this claim and keep the holder reason in the config.
