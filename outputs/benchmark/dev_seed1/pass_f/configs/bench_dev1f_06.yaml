source_reliability:
  identity: 0.5
  address: 0.6
  classification: 0.3
  contact: 0.1
source_reliability_basis: Research extract of IP filings with anonymised party IDs and filer names; names and addresses
  are as filed, not verified against a business register.
meaning_check_responses:
- check_id: identifier_checksum_abn
  action: kept
  reason: The abn transform rejects checksum failures, so only checksum-valid ABNs are emitted; the gated type=abn
    rows are the ones mapped.
source_id: bench_dev1f_06
config_version: 1
validation_summary:
  held_out_rows: 300
  observations_in_held_out: 1277
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-159cb32d
    field: entity.trading_name<-party_name
    problem: Some party_name values are anonymised hashes (for example 'tde4084c80e515ae77542c13d29cf7430'), not
      names. Mapping them as the entity's trading name states a trading name the source does not support.
    severity: blocking
    suggested_fix: Do not map values that are hex hashes or placeholders to entity.trading_name. Add a rule that
      drops them, or leave them unmapped with a reason.
  - id: c-4aacda0a
    field: entity.abn<-lord_party_id
    problem: The config says only rows with lord_party_id_type=abn carry ABNs, but the regex and checksum do not
      check the type column. A party_id value that is 11 digits with a '.0' suffix and a valid checksum would be
      emitted as an ABN, which the source does not state.
    severity: blocking
    suggested_fix: Gate the entity.abn mapping on lord_party_id_type == 'abn' (a conditional or pre-filter transform),
      not only on the regex and checksum.
  - id: c-f8e44550
    field: entity.trading_name<-party_name
    problem: Rows such as 'francesca garreffa' are person names with only an anonymised party_id and no business
      identifier. Rule 18 says these should be no_business_entities, but the config maps them as business entities.
    severity: advisory
    suggested_fix: Consider flagging individual filers without an ABN as non-entity rows, or document that the IP
      register lists individuals as filers.
  - id: c-81c519b4
    field: entity.trading_name<-party_name
    problem: party_name is an IP register filer name that the data does not label as registered or licensee. Mapping
      it to trading_name is correct under rule 5, but the mapping_confidence should be stated at 0.6 or lower.
    severity: advisory
    suggested_fix: Set mapping_confidence to 0.6 or lower for this column and record that it is an unlabelled filer
      name.
  - id: c-670a9016
    field: entity.trading_name<-party_name
    problem: The row for 'francesca garreffa' (party_id type, no ABN) is mapped as an entity trading name. Rule
      18 treats individuals with no business identifier as not business entities. The party_name is a person-like
      name with no business identifier, so the mapping does not say the person is an entity.
    severity: advisory
    suggested_fix: Gate the entity-level trading_name observation on the row having a business identifier (abn type),
      or record a caveat that party_id-type person filers are IP registrants, not confirmed business entities.
  - id: c-7afde8b9
    field: entity.trading_name<-party_name
    problem: party_name is an IP register filer name that is not labelled as the registered name, so it is mapped
      to trading_name. The config gives no mapping_confidence, and the rule requires 0.6 or lower for such a column.
    severity: advisory
    suggested_fix: State mapping_confidence at 0.6 or lower for this claim and set source_reliability_basis to explain
      that the IP register filer name is not a registered name.
  - id: c-012b46f2
    field: record_id
    problem: record_id is built from lord_party_id, lord_party_id_type and financial_year without a stated check_unique.
      Each row is a party for one financial year, so the composite is probably unique, but the config does not say
      it was verified.
    severity: advisory
    suggested_fix: Run check_unique on the composite key and record the result, or switch to hash_row=true if duplicates
      appear.
