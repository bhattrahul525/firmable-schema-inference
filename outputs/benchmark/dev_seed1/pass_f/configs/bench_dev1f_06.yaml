what_it_is: Australian IP research panel of IP-filing parties (designs, plant breeder's rights, trade marks) with
  yearly filing and grant counts, from the IPLORD longitudinal dataset.
one_row_is: one IP party (anonymised party_id or ABN) in one financial year, with its filing/grant counts for that
  year.
