  critique_issues:
  - id: c-b30f629f
    field: entity.trading_name<-Business Name
    problem: This is a licence register, and the row's subject is the licence holder. Rule 5b allows the holder's
      name to map to legal_name at 0.7 or lower when the register does not label it as the licensee name. The config
      instead maps it to trading_name, which is the safer default under rule 5 and is not a misstatement, but the
      config records no mapping_confidence and the reasoning is not tied to the register's holder role.
    severity: advisory
    suggested_fix: Keep trading_name at 0.6 or lower, or consider legal_name at 0.7 or lower under rule 5b. Record
      mapping_confidence explicitly and note that the subject is the licence holder.
  - id: c-8fbccbc1
    field: entity.entity_type
    problem: Business Name values end in 'Pty Ltd' on every sampled row. The source has no entity_type column, so
      rule 7 permits entity_type_from_suffix on the name column. The config leaves entity_type unmapped, so every
      entity is recorded as unknown, which is less rich than the source supports.
    severity: advisory
    suggested_fix: Consider mapping entity.entity_type with entity_type_from_suffix on Business Name, after checking
      the suffix rule on a wider sample of names.
  - id: c-b7d6c6d9
    field: entity.status
    problem: Licence Status (values such as 'Current') is unmapped because it describes the licence, not the entity.
      That is a reasonable call. The status enum is not otherwise populated, so the entity's status is left unobserved
      from this source.
    severity: advisory
    suggested_fix: Keep Licence Status unmapped unless the dataset defines whether a current licence implies an
      active entity; document the decision in the unmapped reason.
