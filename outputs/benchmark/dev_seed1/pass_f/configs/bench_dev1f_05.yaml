  critique_issues:
  - id: c-627b8409
    field: entity.legal_name<-Licensee Name
    problem: The 'EL-HELOU, Paul' row is an individual licence holder with no ABN or ACN in the row. Rule 18 treats
      individuals without a business identifier as no_business_entities, but the mapping still emits a legal_name
      and entity_type for them. Rule 4 does allow registrants to be mapped the same way, so this is a judgement
      call rather than a clear error.
    severity: advisory
    suggested_fix: Confirm whether individual licence holders without a business identifier should count as business
      entities under this dataset's rules. If not, exclude rows lacking an ABN/ACN, or record a note on the observation.
  - id: c-ec3433f6
    field: valid_to
    problem: '''Licence Expiry Date'' is unmapped with the reason that there is no ontology field for licence validity
      end. Rule 10 does allow valid_to from a column stating when the entity''s own licence ended, and the ontology
      describes valid_to as covering licence or status end. The envelope sets valid_to to null on every row, so
      the expiry date is discarded.'
    severity: advisory
    suggested_fix: Consider mapping 'Licence Expiry Date' to valid_to (parse with dd/mm/yyyy after checking with
      try_transform), at least for the observation describing the licence, and state the basis. Otherwise keep it
      unmapped with the reason recorded.
  - id: c-033f1c68
    field: entity.status
    problem: Action Type values such as 'Automatic Suspension' and 'Rectification Order' describe the licence status,
      and the mapping leaves status unmapped. The reason given is that the action type is not an entity status value.
      The status enum includes 'suspended', so some rows could support a status claim, although the source describes
      the licence rather than the entity.
    severity: advisory
    suggested_fix: Either keep status unmapped and state that the regulatory action describes the licence rather
      than the entity, or map 'Automatic Suspension' to suspended with a caveat that it refers to the licence. Do
      not map the other action types.
  - id: c-ae2ae4f9
    field: observation.licence
    problem: The config does not record the dataset licence, and the observation envelope requires it. The licence
      should be taken from CKAN metadata rather than left blank or guessed.
    severity: advisory
    suggested_fix: Add the licence from the dataset metadata, or record 'unknown' and flag it as a finding.
