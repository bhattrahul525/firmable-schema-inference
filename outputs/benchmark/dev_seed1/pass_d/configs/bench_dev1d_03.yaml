  - id: c-a1b73490
    field: entity.legal_name<-SchoolName
    problem: SchoolName is mapped to entity.legal_name, but the source does not say it is the registered name. The
      config's own reason admits it is 'not explicitly labelled as registered name'. Rule 5 allows legal_name only
      when the data says the name is registered, licensee or supplier name, so this claim is not supported by the
      source.
    severity: blocking
    suggested_fix: Remove the legal_name mapping, or map SchoolName to entity.trading_name if it is treated as the
      name the school operates under. Keep it as legal_name only if the source documentation confirms it is the
      registered name.
  - id: c-7ac23a85
    field: record_id
    problem: record_id is built from SchoolNumber and Fin_Period, but the config does not show a check_unique result
      or hash_row fallback. Rule 15 requires one of these to be confirmed.
    severity: advisory
    suggested_fix: Verify that the SchoolNumber and Fin_Period combination is unique across all rows, and record
      that check in the config.
  - id: c-f42150cc
    field: observed_at
    problem: observed_at comes from resource_last_modified, which is reasonable because LoadDate is a system timestamp.
      The Fin_Period value (e.g. 201506) states which financial period the figures relate to, but it is not carried
      into any envelope or claim field, so the period the claim refers to is lost.
    severity: advisory
    suggested_fix: Consider recording Fin_Period as a statement-period attribute on the observation (not as valid_from)
      so the period is traceable to the claim.
  - id: c-1ac8a6bf
    field: entity.abn<-ABN
    problem: The ABN mapping is consistent with the examples (11-digit values through the abn transform). The examples
      do not show whether any ABN fails the checksum, so the transform's pass or fail behaviour is not visible here.
    severity: advisory
    suggested_fix: Confirm that rows failing the abn checksum are dropped or flagged rather than emitted as valid
      ABNs.
  - id: c-f4425562
    field: entity.trading_name<-SchoolName
    problem: The mapping is reasonable, but the source does not say SchoolName is a name the school trades under.
      It is the school's name as listed, and the reason text only argues it is not the registered name. The trading-name
      claim rests on that reading.
    severity: advisory
    suggested_fix: Keep trading_name, but state in the reason that the column is the school's public/operating name
      as listed, not a trading-as or business-name claim. Consider lowering mapping_confidence to reflect this.
  - id: c-698d2d1e
    field: entity.abn<-ABN
    problem: The ABN column is presented as the school's own ABN. The source does not say whose ABN it is. Public
      schools are often under a controlling body or department, so the identifier may belong to that body rather
      than the school. The checksum validates format only, not ownership.
    severity: advisory
    suggested_fix: Keep the abn mapping, since the checksum transform applies, but record in the reason that ownership
      is not stated by the source. Consider a lower mapping_confidence and a note in source_reliability_basis. Optionally
      check the ABNs against the ABR before relying on them as school identifiers.
  - id: c-b82d6811
    field: record_id
    problem: record_id is built from SchoolNumber plus Fin_Period, but check_unique is not stated. Fin_Period is
      constant (201506) across every example row, so uniqueness depends entirely on SchoolNumber. If the file ever
      holds multiple rows per school for one period, the id will collide.
    severity: advisory
    suggested_fix: Confirm uniqueness of the composite key across the full file with check_unique and record the
      result, or fall back to hash_row if it fails.
  - id: c-54ca055d
    field: observed_at
    problem: The config says observed_at comes from resource_last_modified, but every example envelope shows observed_at
      as 2026-11-10T03:54:44, which looks like an ingest time, not the resource metadata date. Either the envelope
      is wrong or the metadata value is not what the config intends.
    severity: advisory
    suggested_fix: Check that the engine resolves resource_last_modified from the CKAN metadata and that the envelope
      observed_at matches it. Keep ingested_at separate and record the true ingest time there.
