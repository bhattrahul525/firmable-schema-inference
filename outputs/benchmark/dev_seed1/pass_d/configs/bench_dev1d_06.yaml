source_reliability_basis: Government IP research longitudinal dataset built from IP office registers; ABN linkage
  is as published and checksum-validated. Names are not used because registered status is not stated.
meaning_check_responses:
- check_id: identifier_checksum_abn
  action: kept
  reason: Values failing the ABN checksum are rejected by the abn transform and not emitted.
source_id: bench_dev1d_06
config_version: 1
needs_transform: []
validation_summary:
  held_out_rows: 300
  observations_in_held_out: 1070
  unanswered_meaning_warnings: []
  abstentions: []
  critique_issues:
  - id: c-eba47ea4
    field: entity.legal_name<-party_name
    problem: The config's own reason admits the dataset does not state that party_name is the registered name, yet
      it is mapped to entity.legal_name. Rule 5 allows legal_name only when the data says the name is registered,
      licensee, or supplier. The examples therefore state a registered-name claim the source does not support, e.g.
      'harris & company solicitors' and 'ergofurn pty ltd' become legal_name observations.
    severity: blocking
    suggested_fix: Remove the entity.legal_name<-party_name mapping. If the name must be kept, map it to a non-legal
      field or leave it unmapped with a reason such as 'IP applicant name; registered status not stated'.
  - id: c-ca514bad
    field: entity.legal_name<-party_name
    problem: Rows with lord_party_id_type=party_id carry hashed or opaque strings in party_name, e.g. 'tc76c9daace7d48792f5a101de4a21518'
      and 't5d79be930b2d178def32c224115d76c8'. These are not business names, so mapping them as legal_name states
      something the source does not support.
    severity: blocking
    suggested_fix: Do not emit legal_name when party_name is a 32-character hex hash. Add a guard or a separate
      transform, or leave those rows unmapped for the name, with a reason stating the value is an opaque identifier.
  - id: c-3c832f1a
    field: entity.abn<-lord_party_id
    problem: The ABN mapping has no explicit condition on lord_party_id_type=abn. The examples show party_id rows
      are skipped, but only because their digit counts happen to fail the regex. An 11-digit party_id would pass
      the regex and rely on the checksum alone to be rejected.
    severity: advisory
    suggested_fix: Make the condition explicit in the config, filtering on lord_party_id_type == 'abn' before regex_extract
      and the abn transform.
  - id: c-77ff1d73
    field: entity.entity_type<-party_name
    problem: entity_type is derived from name suffixes (e.g. 'pty ltd' gives company). Rule 7 permits this when
      no explicit column exists, but the suffix is read from a name that is not stated to be registered, so the
      'company' claim is weaker than the rule implies.
    severity: advisory
    suggested_fix: Keep the suffix rule as permitted, but record the caveat and consider lowering field_confidence
      or pairing it with the legal_name decision above.
  - id: c-d133ecd4
    field: record_id
    problem: record_id is built from lord_party_id and financial_year, but no check_unique result is shown. Uniqueness
      is not demonstrated for that pair.
    severity: advisory
    suggested_fix: Run check_unique on (lord_party_id, financial_year) across the full member, or set hash_row=true
      if duplicates appear.
