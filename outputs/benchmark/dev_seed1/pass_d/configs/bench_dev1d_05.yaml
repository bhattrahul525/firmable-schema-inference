  critique_issues:
  - id: c-cbfee42b
    field: valid_from
    problem: The emitted envelope sets valid_from from the Action Date column (e.g. Galaxy Builders 2025-09-26),
      but the config has no fields entry or transform for it, and Action Date is not listed in unmapped. Rule 3
      requires every column to be accounted for, and the emitted date has no config trace.
    severity: advisory
    suggested_fix: Add an explicit valid_from mapping from Action Date with parse_date '%d/%m/%Y' (confirm with
      try_transform), or list Action Date in unmapped with a reason. Note that it dates a licence action, so describe
      valid_from as the action start, not the licence start.
  - id: c-2884219a
    field: valid_to
    problem: The unmapped entry for Action End Date says 'used for valid_to', but no valid_to mapping appears in
      fields. The envelope still emits valid_to (e.g. Jensen Hughes 2026-03-26), so the config and the output disagree.
    severity: advisory
    suggested_fix: Either add a parse_date mapping from Action End Date to valid_to (with 'N/A' treated as null)
      or correct the unmapped reason. Keep the N/A-to-null handling explicit.
  - id: c-b9c259a5
    field: entity.status
    problem: Action Type values such as 'Automatic Suspension' and 'Suspension' describe a licence action, and the
      config correctly declines to map them to entity.status. The config does not explain that the current licence
      state is therefore not captured anywhere, which may hide a useful claim.
    severity: advisory
    suggested_fix: Keep entity.status unmapped, but record in the config notes that licence suspension is a licence-level
      regulatory state and is not an entity status claim. Consider a separate licence-status field if the ontology
      adds one.
