  - id: c-56ffb14b
    field: observed_at
    problem: observed_at is taken from resource_last_modified, which is 2021-08-02, but the last example row has
      an Award contract date of 13/08/2021, after that timestamp. A claim cannot have been stated before the award
      it describes, so the metadata timestamp may not reflect when these rows were stated.
    severity: advisory
    suggested_fix: Verify the dataset's resource_last_modified value for this resource, and consider whether a per-row
      statement date exists or whether the observation time needs a caveat.
  - id: c-c015e9bd
    field: address.state
    problem: The supplier address column often contains the state (for example 'Manoora QLD', 'Brisbane City QLD',
      'Cairns'), but no address.state or address.postcode mapping is configured. The postcode is also embedded in
      some values (for example '249 Boundary Street, West End 4101').
    severity: advisory
    suggested_fix: Consider parsing state and postcode from the supplier address with a transform if one exists.
      Otherwise, record in the config that these are left inside address.full.
  - id: c-600018bb
    field: record_id
    problem: record_id uses hash_row, but the 'Contract reference number' column appears unique per row in the sample
      and could identify each row directly. Hashing the whole row also means any re-export that changes a field
      such as the contract value would produce a new record id.
    severity: advisory
    suggested_fix: Check whether 'Contract reference number' is unique across the file using check_unique. If it
      is, use it as the record_id column and keep hash_row only as a fallback.
  - id: c-cfdf714d
    field: entity.legal_name<-Supplier name
    problem: Some supplier names look like short or trading-style names (for example 'QRMC', 'Benstar', 'Deloitte').
      The column is the contracted supplier name, which rule 5 accepts as the supplier name. However, the reason
      text says the data does not state it is the registered name, which is an inconsistency with that rule.
    severity: advisory
    suggested_fix: Keep the mapping to legal_name, since the column is the supplier name. Revise the reason to say
      it is the contracted supplier name, and treat legal_name as a claim with moderate mapping confidence.
