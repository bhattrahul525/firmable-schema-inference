  critique_issues:
  - id: c-48681020
    field: entity.status<-CRED_LIC_STATUS
    problem: The source column CRED_LIC_STATUS holds the status of the credit licence (APPR = approved, SUSP = suspended),
      but the mapping writes it to entity.status as the status of the entity. Rows such as FIRST MORTGAGE MANAGED
      INVESTMENTS LIMITED therefore get the claim that the company is 'active', which the source does not state.
    severity: blocking
    suggested_fix: Remove the entity.status mapping, or record the licence status under a field that means licence
      status if the ontology has one. If it is kept, the reason must say it is licence status and not entity status.
  - id: c-16a4ae52
    field: entity.abn / entity.acn
    problem: CRED_LIC_ABN_ACN mixes 11-digit ABNs and 9-digit ACNs, and both fields read the same column. The config
      relies on the abn and acn transforms to split them by length, which is acceptable, but no mapping_confidence
      or note records that the split is by length alone.
    severity: advisory
    suggested_fix: Add a mapping_confidence and a reason that states the split is by digit length and checksum.
      No `when` clause is needed unless another column says which rows hold an ABN or ACN.
  - id: c-6189cf50
    field: entity.legal_name<-CRED_LIC_NAME
    problem: The name is mapped to legal_name under rule 5b, which needs the source to label the name as the licensee
      or holder. The header CRED_LIC_NAME does not say so by itself, and the config has no mapping_confidence. Under
      5b that means confidence should be 0.7 or lower unless the register's label is cited.
    severity: advisory
    suggested_fix: Add a mapping_confidence for the legal_name mapping. Cite the register's own wording (for example,
      the licensee column definition) to support the 5b mapping, or lower the confidence to 0.7 or below.
  - id: c-1750d38f
    field: entity.status<-CRED_LIC_STATUS
    problem: The map_values table covers only APPR and SUSP. The profile shows only APPR, so other licence status
      codes, such as cancelled or expired, are unmapped and will be handled silently.
    severity: advisory
    suggested_fix: Confirm the full set of CRED_LIC_STATUS values in the profile and map each one, or leave unseen
      values unmapped with an explicit note.
  - id: c-1faa76aa
    field: record_id
    problem: record_id uses CRED_LIC_NUM but the config does not say it was checked for uniqueness (check_unique)
      or what happens if it is not unique.
    severity: advisory
    suggested_fix: Record a check_unique result for CRED_LIC_NUM, or use hash_row if uniqueness cannot be confirmed.
  - id: c-64315a29
    field: config (source reliability and confidence)
    problem: The config has no mapping_confidence per field and no source_reliability with its basis, although rules
      14 and 16 require them.
    severity: advisory
    suggested_fix: Add mapping_confidence for each field and a source_reliability value per claim kind, with source_reliability_basis
      explaining the judgement.
