  critique_issues:
  - id: c-af437acf
    field: address.state<-Licensee Business Address
    problem: The regex_extract is case-sensitive and only matches uppercase state codes. Row 81888 has 'Qld 4700',
      so no address.state observation is produced for it even though the state is stated in the source.
    severity: advisory
    suggested_fix: Make the pattern case-insensitive (e.g. a (?i) flag or equivalent) so lowercase or mixed-case
      state abbreviations are captured, then keep state_code to normalise them.
  - id: c-9aa9dfc3
    field: record_id
    problem: record_id is taken from the 'id' column, but the mapping does not state a uniqueness check. The config
      gives no evidence that 'id' is unique across rows.
    severity: advisory
    suggested_fix: Confirm 'id' is unique with check_unique, or fall back to a hash_row or composite key if it is
      not.
  - id: c-e07d9bf1
    field: entity.entity_type<-Licence Type DESC
    problem: Mapping Individual to unknown is a defensible conservative choice, but it discards a meaningful source
      value. The source states the holder is an individual, which is not the same as the entity type being unknown.
    severity: advisory
    suggested_fix: Keep the mapping if the team prefers conservatism, but document in the config reason that Individual
      is deliberately mapped to unknown, since the ontology has no individual value and sole_trader must not be
      inferred from a person-like name.
  - id: c-3eb826aa
    field: industry_code
    problem: Licence Class Type (e.g. 'Builder - Medium Rise', 'Carpentry', 'Painting and Decorating') describes
      the licensed scope of work and could arguably populate industry_code as the source's own description. It is
      currently unmapped with the reason 'no ontology field', which is slightly inaccurate because industry_code
      exists in the ontology.
    severity: advisory
    suggested_fix: Consider mapping Licence Class Type to entity.industry_code as the raw description (rule 9),
      with a note that it is a licence scope rather than an ANZSIC classification, or keep it unmapped and correct
      the reason to state that it is a licence scope, not an industry code.
  - id: c-dbb6c742
    field: entity.legal_name<-Licensee Name
    problem: The register is a licensing body's list of licence holders, so Licensee Name is the holder under rule
      5b. The config does not record a mapping_confidence or a note that this relies on 5b, so the label basis is
      not visible to reviewers.
    severity: advisory
    suggested_fix: Record mapping_confidence at or below 0.7 with a reason that cites rule 5b and the holder-of-licence
      label, or add an explicit statement in the reason that the register lists Licensee Name as the holder.
