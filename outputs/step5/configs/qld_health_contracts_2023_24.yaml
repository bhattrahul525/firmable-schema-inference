validation_summary:
  held_out_rows: 105
  observations_in_held_out: 327
  unanswered_meaning_warnings: []
  abstentions:
  - field: entity.legal_name / entity.abn / address.full (multi-supplier rows)
    reason: 'Cells listing several suppliers are deliberately not mapped: supplier and ABN lists use mixed separators
      ('', '' and ''; '') so positional alignment is unreliable. These rows (about 6%) yield no supplier observations.
      Advisory critique suggested split; not applied to avoid misaligned suppliers.'
  critique_issues:
  - id: c-a4e9753e
    field: address.full<-Supplier address
    problem: For the ADITS NQ PTY LTD row the Supplier address cell is the placeholder "0", and the mapping emits
      it as address.full = "0". The row's Supplier ABN is a single 11-digit ABN, so the `when` clause passes and
      the placeholder is mapped as a real address. The source does not support an address here.
    severity: blocking
    suggested_fix: Add a rule that rejects non-address placeholder values such as "0" (for example a regex requiring
      at least one letter, or a value exclusion list), or treat "0" as null, and re-check the rows where this column
      holds placeholders.
  - id: c-a26924a6
    field: entity.abn<-Supplier ABN
    problem: The multi-supplier rows (for example the Cleanaway/Ace Waste row and the ALPENGLOW row) produce no
      entity observations at all. Rule 12 says aligned columns should be split on ';' within one group so items
      line up by position. The config instead skips these rows entirely, so their suppliers are lost.
    severity: advisory
    suggested_fix: Add split on ';' to Supplier name, Supplier ABN and Supplier address in a shared group, so each
      supplier is emitted as its own entity observation, with the `when` restriction removed or applied per item.
  - id: c-edb78fe3
    field: address.state
    problem: The Supplier address cells often contain a state (for example "Newcastle West, NSW, 2302" or "Chapel
      Hill QLD 4069"), but the config maps only address.full. The state and postcode are not parsed out, though
      they are present in the source text.
    severity: advisory
    suggested_fix: Consider a parse step that extracts the state and postcode from the Supplier address into address.state
      and address.postcode, with a note that this is L1 parsing and that the field_confidence should reflect it.
  - id: c-872478a0
    field: entity.legal_name<-Supplier name
    problem: Multi-supplier cells (for example the Cleanaway/Ace Waste and ALPENGLOW rows) produce no entity observations
      at all. Rule 12 asks for split on every aligned column in one group so that items line up by position. The
      config skips these rows instead, so the listed suppliers and their ABNs are lost even though the source holds
      them.
    severity: advisory
    suggested_fix: Add split (';') to Supplier name, Supplier ABN and Supplier address in one shared group, with
      the when condition applied per item, so each supplier in a multi-supplier cell is emitted. Alternatively,
      record in the config why these rows are deliberately excluded.
  - id: c-05f767af
    field: entity.abn<-Supplier ABN
    problem: The reason says the abn transform skips multi-supplier cells, but the transform is applied to the whole
      cell after spaces are stripped. The skip is therefore a property of the engine's behaviour, not something
      the config enforces. The config does not state this clearly, and no when condition guards this field the way
      it guards the name and address fields.
    severity: advisory
    suggested_fix: Add the same single-ABN when condition used on Supplier name to entity.abn<-Supplier ABN, so
      that the guard is explicit in the config rather than resting on transform behaviour.
  - id: c-8be2d1b2
    field: observation envelope
    problem: The config does not show the envelope fields that are required by the ontology (licence, source_reliability,
      extractor_version, source_id). The sample output shows observed_at only. The licence in particular has no
      value in the config, and the source is a government contracts dataset whose licence is not stated here.
    severity: advisory
    suggested_fix: Confirm that licence is taken from the CKAN metadata (or recorded as 'unknown' and flagged),
      and that source_reliability and extractor_version are set and documented, with a basis for the reliability
      judgement.
