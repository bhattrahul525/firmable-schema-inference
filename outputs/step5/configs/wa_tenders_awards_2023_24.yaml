config_version: 1
validation_summary:
  held_out_rows: 300
  observations_in_held_out: 722
  unanswered_meaning_warnings: []
  abstentions:
  - field: entity.legal_name<-Supplier_Name (parenthesised rows)
    reason: Cells of the form 'Outer name (Registered name)' cannot be split into legal_name and trading_name by
      the current transforms without mapping two canonical fields from one column; left unmapped and listed in needs_transform.
  critique_issues:
  - id: c-4449c1ab
    field: entity.legal_name<-Supplier_Name
    problem: 'Supplier_Name cells often hold two names: an outer name and a parenthesised registered name, e.g.
      ''My Home Care (MyHomecare Pty Ltd)'', ''Programmed Property Services (Programmed Property Services Pty Ltd)''
      and ''DFP Recruitment Services (DFP Recruitment Services Pty Ltd ATF The DFP Business Trust)''. The whole
      cell is mapped as legal_name, which claims the outer trading-style name is part of the registered name. The
      source does not support that. The outer name belongs in entity.trading_name at most, and the registered name
      is only the parenthesised part.'
    severity: blocking
    suggested_fix: 'Split the cell on the parentheses: map the parenthesised registered name to entity.legal_name
      and the outer name to entity.trading_name, or add a split/extract transform if one exists. If no such transform
      exists, list the column under needs_transform rather than mapping the whole string as legal_name. Keep mapping_confidence
      at or below 0.7 until this is done.'
  - id: c-a849951c
    field: address.full<-Supplier_Address
    problem: One row reads 'Level 5, 25 Walters Drive, Osborne Park, OSBORNE PARK, 6017', with the locality repeated.
      Clean_whitespace does not remove this duplication, so the address is kept as the source has it.
    severity: advisory
    suggested_fix: Leave as is, since rule 1 forbids cleaning beyond the transforms. Optionally note the duplicated
      locality as a data-quality caveat.
  - id: c-819f879a
    field: record_id
    problem: Reference_Number is not unique across agencies in general, and the record_id list names five columns
      without showing that the combination is checked as unique. Several rows share generic values, so the key may
      not reliably trace back to the exact raw row.
    severity: advisory
    suggested_fix: Confirm with check_unique that the combined key is unique across the file, or fall back to hash_row=true.
  - id: c-0c59f91a
    field: observation.licence / observation.source_id
    problem: The config does not show the envelope fields source_id or licence. These are required on every observation.
    severity: advisory
    suggested_fix: Add source_id as a stable dataset identifier and take the licence from the CKAN metadata, recording
      'unknown' with a flag if none is given.
  - id: c-bcf603b4
    field: entity.legal_name<-Supplier_Name
    problem: The when-clause restricts legal_name to rows without parentheses, so every parenthesised supplier row
      (e.g. 'Programmed Property Services (Programmed Property Services Pty Ltd)', 'My Home Care (MyHomecare Pty
      Ltd)') gets no legal_name observation at all. The registered name in the brackets is lost, and the outer name
      is not kept as trading_name either. This is a coverage gap rather than a wrong claim, and the needs_transform
      entry already records it.
    severity: advisory
    suggested_fix: Until a conditional split exists, consider a provisional trading_name mapping of the outer part
      at confidence 0.6 or lower, and track the parenthesised registered name as a pending needs_transform item.
  - id: c-82b102da
    field: entity.legal_name<-Supplier_Name
    problem: Supplier_Name appears both as a mapped source (entity.legal_name<-Supplier_Name) and in the unmapped
      list with the reason that parenthesised rows are not mapped. The column is therefore accounted for twice in
      contradictory ways.
    severity: advisory
    suggested_fix: Remove Supplier_Name from unmapped and describe the partial coverage in the field's reason or
      in needs_transform.
  - id: c-73887b0f
    field: record_id
    problem: record_id is a composite of five columns, including Title and Public_Authority, with no check_unique
      evidence shown. Reference_Number looks like the natural key, but the config does not show it is unique on
      its own.
    severity: advisory
    suggested_fix: Confirm uniqueness of Reference_Number with check_unique; if it holds, use it alone, otherwise
      state the composite key's uniqueness check.
  - id: c-1b1da414
    field: entity.trading_name
    problem: The config has no trading_name mapping, although the parenthesised cells (e.g. 'West to West Indigenous',
      'Talent International', 'Datacom Systems') hold a trading-style outer name in the Supplier_Name column that
      the rules allow to map to trading_name at 0.6 or lower.
    severity: advisory
    suggested_fix: Consider mapping the outer part of parenthesised Supplier_Name cells to entity.trading_name at
      confidence 0.6 or lower, using split/regex on the same column.
  - id: c-9c9bfa90
    field: entity.legal_name<-Supplier_Name mapping_confidence
    problem: No mapping_confidence is shown for the legal_name or address.full fields. Rule 14 requires one per
      mapped field, and the review cannot check whether 0.9 or above is justified.
    severity: advisory
    suggested_fix: 'State mapping_confidence per field: legal_name from ''Supplier_Name'' (supplier name, non-parenthesised
      rows) and address.full from ''Supplier_Address'' (supplier-prefixed column).'
