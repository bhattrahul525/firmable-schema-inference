needs_transform:
- source: Supplier_Name
  why: For cells of form 'Outer name (Registered name)' the parenthesised part should be legal_name and the outer
    part trading_name; the engine has no conditional split-by-pattern extraction into two canonical fields yet.
    Parenthesised rows currently get no legal_name.
source_reliability:
  identity: 0.6
  address: 0.6
  classification: 0.3
  contact: 0.3
source_reliability_basis: Government tender award register maintained by agencies; supplier names are as entered
  by each agency, so accuracy varies and is not independently checked.
