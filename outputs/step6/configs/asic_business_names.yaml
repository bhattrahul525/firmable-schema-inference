  - id: c-d18e885e
    field: address.state<-BN_STATE_OF_REG
    problem: BN_STATE_OF_REG is the state where the business name is registered, which the config's own reason says
      is not the holder's address. The ontology's address.state describes the entity's address, so the mapping states
      something the source does not support. The example row for NUMBER ONE CLEANING SERVICE emits address.state
      NSW as if it were the entity's location.
    severity: blocking
    suggested_fix: Remove this mapping from address.state. Leave BN_STATE_OF_REG unmapped with the reason that it
      is the business name registration state, not the holder's address.
  - id: c-3d723a70
    field: entity.status<-BN_STATUS
    problem: BN_STATUS describes the status of the business name registration, not the status of the registrant
      entity. Mapping 'Registered' to entity.status 'active' asserts something about the holder that the column
      does not state, since the holder could be deregistered or in liquidation.
    severity: advisory
    suggested_fix: Keep the mapping but lower mapping_confidence, or note in the config reason that the status applies
      to the business name registration. Consider a name-registration-specific field if the ontology has one.
  - id: c-2ff355ed
    field: valid_from
    problem: BN_REG_DT records when the business name was registered, not when the entity's own registration started.
      Rule 10 allows valid_from only from a column stating the entity's own registration start, so this date may
      be read as the entity's registration date.
    severity: advisory
    suggested_fix: Confirm that the business name registration date is an acceptable proxy for the entity's registration,
      or document this caveat in the config reason. Consider leaving valid_from unmapped if the policy is strict.
  - id: c-e89e6d09
    field: valid_to
    problem: BN_CANCEL_DT is the cancellation date of the business name registration, not the end of the entity's
      own registration or status. The same caveat as valid_from applies.
    severity: advisory
    suggested_fix: Document that valid_to refers to the business name registration ending, or leave it unmapped
      under the strict reading of rule 10.
  - id: c-beb9f3ab
    field: observation.licence
    problem: The config has no licence entry for the envelope, and the ontology requires one. The config does not
      show whether the dataset's licence was read from metadata.
    severity: advisory
    suggested_fix: Add the licence from the dataset metadata, or record 'unknown' and flag it as a finding.
